<body class="overflow-x-hidden">
  <div id="initial-loader" class="initial-loader" aria-live="polite">
    <div class="initial-loader__card">
      <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
      <p>Downloading data. Please wait...</p>
    </div>
  </div>
  <div id="app"></div>

  <script type="module">
    // Access Vue from global scope since it's loaded as a script tag
  const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

    // IIFE to handle async imports
    (async () => {
      // ==================== IndexedDB Manager ====================
      class MurajahDB {
        constructor() {
          this.dbName = 'murajah-db';
          this.version = 4; // Bumped version for new resourceCache store
          this.db = null;
        }

        async init() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);

            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
              this.db = request.result;
              console.log('[Murajah] IndexedDB initialized');
              resolve();
            };

            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              
              // Create object stores if they don't exist
              if (!db.objectStoreNames.contains('appData')) {
                db.createObjectStore('appData', { keyPath: 'id' });
              }
              if (!db.objectStoreNames.contains('recordings')) {
                db.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
              }
              if (!db.objectStoreNames.contains('dailyGoals')) {
                db.createObjectStore('dailyGoals', { keyPath: 'date' });
              }
              if (!db.objectStoreNames.contains('quranCache')) {
                db.createObjectStore('quranCache', { keyPath: 'id' });
              }
              // New store for caching all static resources (JS, CSS, JSON, fonts)
              if (!db.objectStoreNames.contains('resourceCache')) {
                db.createObjectStore('resourceCache', { keyPath: 'id' });
              }
              console.log('[Murajah] IndexedDB schema created/upgraded');
            };
          });
        }

        async saveData(data) {
          const tx = this.db.transaction(['appData'], 'readwrite');
          const store = tx.objectStore('appData');
          store.put({ id: 'murajah-data', ...data });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log('[Murajah] Data saved to IndexedDB');
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadData() {
          const tx = this.db.transaction(['appData'], 'readonly');
          const store = tx.objectStore('appData');
          return new Promise((resolve, reject) => {
            const request = store.get('murajah-data');
            request.onsuccess = () => {
              const result = request.result;
              if (result) {
                const { id, ...data } = result;
                resolve(data);
              } else {
                resolve(null);
              }
            };
            request.onerror = () => reject(request.error);
          });
        }

        async clearAll() {
          const tx = this.db.transaction(['appData', 'recordings', 'dailyGoals', 'resourceCache'], 'readwrite');
          tx.objectStore('appData').clear();
          tx.objectStore('recordings').clear();
          tx.objectStore('dailyGoals').clear();
          tx.objectStore('resourceCache').clear();
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log('[Murajah] IndexedDB cleared (including resource cache)');
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        }

        async saveRecording(index, recording) {
          const tx = this.db.transaction(['recordings'], 'readwrite');
          const store = tx.objectStore('recordings');
          store.put({ id: `recording-${index}`, ...recording });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadRecording(index) {
          const tx = this.db.transaction(['recordings'], 'readonly');
          const store = tx.objectStore('recordings');
          return new Promise((resolve, reject) => {
            const request = store.get(`recording-${index}`);
            request.onsuccess = () => {
              const result = request.result;
              if (result) {
                const { id, ...data } = result;
                resolve(data);
              } else {
                resolve(null);
              }
            };
            request.onerror = () => reject(request.error);
          });
        }

        async deleteRecording(index) {
          const tx = this.db.transaction(['recordings'], 'readwrite');
          const store = tx.objectStore('recordings');
          store.delete(`recording-${index}`);
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async saveTheme(theme) {
          const tx = this.db.transaction(['appData'], 'readwrite');
          const store = tx.objectStore('appData');
          store.put({ id: 'murajah-theme', value: theme });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadTheme() {
          const tx = this.db.transaction(['appData'], 'readonly');
          const store = tx.objectStore('appData');
          return new Promise((resolve, reject) => {
            const request = store.get('murajah-theme');
            request.onsuccess = () => {
              const result = request.result;
              resolve(result ? result.value : 'light');
            };
            request.onerror = () => reject(request.error);
          });
        }

        async saveLanguage(locale) {
          const tx = this.db.transaction(['appData'], 'readwrite');
          const store = tx.objectStore('appData');
          store.put({ id: 'murajah-language', value: locale });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadLanguage(defaultLocale = 'en') {
          const tx = this.db.transaction(['appData'], 'readonly');
          const store = tx.objectStore('appData');
          return new Promise((resolve, reject) => {
            const request = store.get('murajah-language');
            request.onsuccess = () => {
              const result = request.result;
              resolve(result ? result.value : defaultLocale);
            };
            request.onerror = () => reject(request.error);
          });
        }

        async saveReciter(reciterId) {
          const tx = this.db.transaction(['appData'], 'readwrite');
          const store = tx.objectStore('appData');
          store.put({ id: 'murajah-reciter', value: reciterId });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log('[Murajah] Reciter saved:', reciterId);
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadReciter(defaultReciter = 'shuraim') {
          const tx = this.db.transaction(['appData'], 'readonly');
          const store = tx.objectStore('appData');
          return new Promise((resolve, reject) => {
            const request = store.get('murajah-reciter');
            request.onsuccess = () => {
              const result = request.result;
              resolve(result ? result.value : defaultReciter);
            };
            request.onerror = () => reject(request.error);
          });
        }

        // ===== Daily Goals Methods =====
        async saveDailyGoal(dailyGoal) {
          const tx = this.db.transaction(['dailyGoals'], 'readwrite');
          const store = tx.objectStore('dailyGoals');
          store.put({ ...dailyGoal, savedAt: new Date().toISOString() });
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log(`[Murajah] Daily goal saved for ${dailyGoal.date}`);
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadDailyGoal(date) {
          const tx = this.db.transaction(['dailyGoals'], 'readonly');
          const store = tx.objectStore('dailyGoals');
          return new Promise((resolve, reject) => {
            const request = store.get(date);
            request.onsuccess = () => {
              resolve(request.result || null);
            };
            request.onerror = () => reject(request.error);
          });
        }

        async loadDailyGoalHistory(daysBack = 90) {
          const tx = this.db.transaction(['dailyGoals'], 'readonly');
          const store = tx.objectStore('dailyGoals');
          return new Promise((resolve, reject) => {
            const request = store.getAll();
            request.onsuccess = () => {
              const allRecords = request.result;
              
              // Filter records from last N days
              const cutoffDate = new Date();
              cutoffDate.setDate(cutoffDate.getDate() - daysBack);
              const cutoffDateStr = cutoffDate.toISOString().split('T')[0];
              
              const recentRecords = allRecords.filter(record => record.date >= cutoffDateStr);
              resolve(recentRecords.sort((a, b) => new Date(a.date) - new Date(b.date)));
            };
            request.onerror = () => reject(request.error);
          });
        }

        async deleteDailyGoal(date) {
          const tx = this.db.transaction(['dailyGoals'], 'readwrite');
          const store = tx.objectStore('dailyGoals');
          store.delete(date);
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log(`[Murajah] Daily goal deleted for ${date}`);
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        }

        async clearOldDailyGoals(daysToKeep = 90) {
          const tx = this.db.transaction(['dailyGoals'], 'readonly');
          const store = tx.objectStore('dailyGoals');
          return new Promise((resolve, reject) => {
            const request = store.getAll();
            request.onsuccess = () => {
              const allRecords = request.result;
              
              const cutoffDate = new Date();
              cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
              const cutoffDateStr = cutoffDate.toISOString().split('T')[0];
              
              const recordsToDelete = allRecords.filter(record => record.date < cutoffDateStr);
              
              if (recordsToDelete.length > 0) {
                const deleteTx = this.db.transaction(['dailyGoals'], 'readwrite');
                const deleteStore = deleteTx.objectStore('dailyGoals');
                recordsToDelete.forEach(record => deleteStore.delete(record.date));
                
                deleteTx.oncomplete = () => {
                  console.log(`[Murajah] Cleaned up ${recordsToDelete.length} old daily goal records`);
                  resolve(recordsToDelete.length);
                };
                deleteTx.onerror = () => reject(deleteTx.error);
              } else {
                resolve(0);
              }
            };
            request.onerror = () => reject(request.error);
          });
        }

        async saveCachedResource(record) {
          if (!record || !record.id) {
            throw new Error('[Murajah] Cache record must include an id field');
          }
          const tx = this.db.transaction(['quranCache'], 'readwrite');
          const store = tx.objectStore('quranCache');
          store.put(record);
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async loadCachedResource(cacheId = 'english-wbw-translation') {
          const tx = this.db.transaction(['quranCache'], 'readonly');
          const store = tx.objectStore('quranCache');
          return new Promise((resolve, reject) => {
            const request = store.get(cacheId);
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
          });
        }

        async deleteCachedResource(cacheId = 'english-wbw-translation') {
          const tx = this.db.transaction(['quranCache'], 'readwrite');
          const store = tx.objectStore('quranCache');
          store.delete(cacheId);
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async saveTranslationCache(record) {
          const cacheRecord = {
            id: record?.id || 'english-wbw-translation',
            resourceKey: 'translations',
            ...record
          };
          return this.saveCachedResource(cacheRecord);
        }

        async loadTranslationCache(cacheId = 'english-wbw-translation') {
          return this.loadCachedResource(cacheId);
        }

        async deleteTranslationCache(cacheId = 'english-wbw-translation') {
          return this.deleteCachedResource(cacheId);
        }
      }

      // Initialize IndexedDB
      const murajahDB = new MurajahDB();
      await murajahDB.init();

      // Initialize Resource Cache for offline support
      const resourceCacheModule = await import('./resources/js/utils/resourceCache.js');
      const { ResourceCache, initResourceCache, getResourceCache, CACHE_VERSION, RESOURCE_MANIFEST, getTotalResourceCount, generatePageFonts, generateTajweedFonts } = resourceCacheModule;
      const resourceCache = initResourceCache(murajahDB);
      
      // Check if cache needs refresh due to version change
      const needsCacheRefresh = await resourceCache.needsVersionRefresh();
      if (needsCacheRefresh) {
        console.log('[Murajah] Cache version changed, will refresh on next preload');
      }

      // Import utility modules - Using unified data loader for both QPC and Indopak layouts
      const dataLoaderModule = await import('./resources/js/utils/unifiedDataLoader.js');
      const { loadAllQuranData, getPageText, getPageWordsDetailed, getLayoutConfig, clearDataCache, preloadLayout } = dataLoaderModule;
      
      const calculationsModule = await import('./resources/js/utils/calculations.js');
      const { 
        calculateMemorizationPercentage,

          const handleTouchStart = (e) => {
            swipeState.startX = e.touches[0].clientX;
            swipeState.startY = e.touches[0].clientY;
            swipeState.isSwiping = true;

          const handleTouchMove = (e) => {

          const handleTouchEnd = () => {
            if (!swipeState.isSwiping) return;

            const deltaY = swipeState.endY - swipeState.startY;
            const minSwipeDistance = 50; // Minimum distance for a valid swipe

            // Only trigger if horizontal swipe is greater than vertical (to avoid conflicts with scrolling)
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {

            const getChunkSize = (chunkIdx) => {

          const getPageDotColor = (perfectCount) => {

            // Scale from 1-100 to gradient
            // For 1-39: light green to medium green
            // For 40-100: medium green to darkest green
            const score = Math.min(perfectCount, 100); // Cap at 100
            
            if (score < 40) {
              // Light green to medium green (1-39)
              // Interpolate between #a7f3d0 (light green) and #34d399 (medium green)
              const ratio = score / 40;
              const r = Math.round(167 - (167 - 52) * ratio); // 167 to 52
              const g = Math.round(243 - (243 - 211) * ratio); // 243 to 211
              const b = Math.round(208 - (208 - 153) * ratio); // 208 to 153
              return `rgb(${r}, ${g}, ${b})`;
            } else if (score < 70) {
              // Medium green to darker green (40-69)
              // Interpolate between #34d399 (medium green) and #059669 (darker green)
              const ratio = (score - 40) / 30;
              const r = Math.round(52 - (52 - 5) * ratio); // 52 to 5
              const g = Math.round(211 - (211 - 150) * ratio); // 211 to 150
              const b = Math.round(153 - (153 - 105) * ratio); // 153 to 105
              return `rgb(${r}, ${g}, ${b})`;
            } else {
              // Darker green to darkest green (70-100)

              const ratio = (score - 70) / 30;
              const r = Math.round(5 - (5 - 6) * ratio); // 5 to 6
              const g = Math.round(150 - (150 - 95) * ratio); // 150 to 95

  <!-- Service Worker Registration for Offline Support -->
  <script>
    // Register Service Worker for PWA/Offline functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js', {
            scope: './'
          });
          
          console.log('[Murajah] Service Worker registered:', registration.scope);
          
          // Check for updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('[Murajah] Service Worker update found');
            
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available
                console.log('[Murajah] New version available');
                // Show update notification to user
                if (window.showUpdateNotification) {
                  window.showUpdateNotification();
                }
              }
            });
          });
          
          // Listen for controller change (new SW activated)
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[Murajah] Service Worker controller changed');
          });
          
          // Listen for content update messages from SW (stale-while-revalidate)
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'CONTENT_UPDATED') {
              console.log('[Murajah] Content updated in background:', event.data.url);
              // For HTML updates, optionally notify user or auto-refresh
              // Currently we just log - the cache is already updated for next load
            }
          });
          
        } catch (error) {
          console.warn('[Murajah] Service Worker registration failed:', error);
        }
      });
      
      // Expose functions for communicating with Service Worker
      window.swCacheFonts = (pages) => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'CACHE_FONTS',
            payload: { pages }
          });
        }
      };
      
      window.swCacheSecondary = () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'CACHE_SECONDARY'
          });
        }
      };
      
      window.swGetCacheStatus = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'GET_CACHE_STATUS' },
            [messageChannel.port2]
          );
        });
      };
      
      window.swClearCache = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(false);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = () => {
            resolve(true);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'CLEAR_CACHE' },
            [messageChannel.port2]
          );
        });
      };
      
      // Debug: List cached fonts
      window.swDebugFontCache = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            console.log('[Murajah Debug] Font cache:', event.data.payload);
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'DEBUG_FONT_CACHE' },
            [messageChannel.port2]
          );
        });
      };
      
      // Debug: Test if a font URL can be matched in cache
      window.swTestFontMatch = (url) => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            console.log('[Murajah Debug] Font match result:', event.data.payload);
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'TEST_FONT_MATCH', url },
            [messageChannel.port2]
          );
        });
      };
    }
    
    // Online/Offline status tracking
    window.addEventListener('online', () => {
      console.log('[Murajah] Back online');
      document.body.classList.remove('offline-mode');
      if (window.updateOnlineStatus) {
        window.updateOnlineStatus(true);
      }
    });
    
    window.addEventListener('offline', () => {
      console.log('[Murajah] Gone offline');
      document.body.classList.add('offline-mode');
      if (window.updateOnlineStatus) {
        window.updateOnlineStatus(false);
      }
    });
  </script>
