                setTimeout(() => location.reload(), 2000);
              } catch (error) {
                console.error('[Murajah] Error resetting app:', error);
                appStore.errorMessage = 'Failed to reset app';
              }
            }
          };

          // ===== Resource Cache Management Methods =====
          
          /**
           * Update cache stats display
           */
          const updateCacheStats = async () => {
            try {
              const stats = await resourceCache.getCacheStats();
              Object.assign(cacheStats, stats);
            } catch (error) {
              console.warn('[Murajah] Failed to update cache stats:', error);
            }
          };

          /**
           * Refresh/download all resources to cache (including all 604 page fonts)
           */
          const refreshAllCache = async () => {
            if (cacheRefreshInProgress.value) return;
            
            cacheRefreshInProgress.value = true;
            cacheStatusMessage.value = { type: 'info', text: t('settings.cacheStarting') || 'Downloading resources for offline use...' };
            cacheRefreshProgress.loaded = 0;
            cacheRefreshProgress.failed = 0;
            cacheRefreshProgress.total = getTotalResourceCount(true); // Include page fonts
            cacheRefreshProgress.current = '';

            try {
              const result = await resourceCache.preloadAllResources((progress) => {
                cacheRefreshProgress.loaded = progress.loaded;
                cacheRefreshProgress.failed = progress.failed;
                cacheRefreshProgress.total = progress.total;
                cacheRefreshProgress.current = progress.current;
              }, { includePageFonts: true }); // Download all page fonts

              await updateCacheStats();

              if (result.failed === 0) {
                cacheStatusMessage.value = { 
                  type: 'success', 
                  text: (t('settings.cacheSuccess') || 'Successfully cached {count} resources!').replace('{count}', result.loaded)
                };
              } else {
                cacheStatusMessage.value = { 
                  type: 'warning', 
                  text: (t('settings.cachePartial') || 'Cached {loaded} resources, {failed} failed').replace('{loaded}', result.loaded).replace('{failed}', result.failed)
                };
              }

              // Clear message after 5 seconds
              setTimeout(() => {
                cacheStatusMessage.value = null;
              }, 5000);

            } catch (error) {
              console.error('[Murajah] Cache refresh failed:', error);
              cacheStatusMessage.value = { 
                type: 'error', 
                text: (t('settings.cacheFailed') || 'Cache refresh failed: {error}').replace('{error}', error.message)
              };
            } finally {
              cacheRefreshInProgress.value = false;
            }
          };

          /**
           * Clear all cached resources
           */
          const clearResourceCache = async () => {
            if (cacheRefreshInProgress.value) return;
            
            if (!confirm(t('settings.clearCacheConfirm') || 'Are you sure you want to clear all cached resources? The app will need to re-download resources.')) {
              return;
            }

            try {
              // Clear IndexedDB resources + font caches
              await resourceCache.clearAll();
              
              // Also clear SW main cache (app shell)
              if (window.swClearCache) {
                try {
                  await window.swClearCache();
                } catch (e) {
                  console.warn('[Murajah] SW cache clear failed:', e);
                }
              }
              
              // Auto-reload to re-download essential resources
              window.location.reload();

            } catch (error) {
              console.error('[Murajah] Failed to clear cache:', error);
              cacheStatusMessage.value = { 
                type: 'error', 
                text: (t('settings.cacheClearFailed') || 'Failed to clear cache: {error}').replace('{error}', error.message)
              };
            }
          };

          /**
           * Refresh app when new version is available.
           * Coordinates with SW: sends SKIP_WAITING if a waiting worker exists,
           * then the controllerchange handler (in SW registration script) will reload.
           * Sets a flag so controllerchange knows this is a user-initiated refresh.
           */
          const refreshApp = async () => {
            showUpdateBanner.value = false;
            sessionStorage.setItem('murajah-just-refreshed', Date.now().toString());
            // Set flag so controllerchange handler knows a reload is already planned
            window.__murajahManualRefresh = true;
            try {
              const reg = await navigator.serviceWorker?.getRegistration();
              if (reg?.waiting) {
                // Tell the waiting SW to activate immediately
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                // controllerchange will fire and handle the reload
                // But add a fallback timeout in case controllerchange doesn't fire
                setTimeout(() => {
                  if (!window.__murajahReloadTriggered) {
                    window.__murajahReloadTriggered = true;
                    window.location.reload();
                  }
                }, 2000);
                return;
              }
            } catch (e) {
              console.warn('[Murajah] Error during refreshApp SW communication:', e);
            }
            // No waiting worker — just reload directly
            window.location.reload();
          };

          /**
           * Dismiss update banner
           */
          const dismissUpdateBanner = () => {
            showUpdateBanner.value = false;
          };

          // Computed
          const currentPageAudioCount = computed(() => {
            return audioStore.recordings.filter(r => r.pageNumber === appStore.currentPage).length;
          });

          const currentPageMistakeCount = computed(() => {
            const mistakes = mistakesStore.mistakes.get(appStore.currentPage);
            return mistakes ? mistakes.size : 0;
          });

          const currentPageMistakes = computed(() => {
            const mistakes = mistakesStore.mistakes.get(appStore.currentPage);
            return mistakes ? Array.from(mistakes).sort((a, b) => a - b) : [];
          });

          const fontSizeStyle = computed(() => {
            const isSmallDevice = window.innerWidth < 640;
            const isMediumDevice = window.innerWidth >= 640 && window.innerWidth < 1024;
            
            let sizeMap;
            if (isSmallDevice) {
              // Smaller sizes for mobile devices
              sizeMap = {
                'small': '14px',
                'medium': '18px',
                'large': '22px'
              };
            } else if (isMediumDevice) {
              // Medium sizes for tablets
              sizeMap = {
                'small': '18px',
                'medium': '26px',
                'large': '32px'
              };
            } else {
              // Larger sizes for desktop
              sizeMap = {
                'small': '20px',
                'medium': '32px',
                'large': '44px'
              };
            }
            const fontSize = sizeMap[settingsStore.fontSize] || '24px';
            Logger.log('[Murajah] fontSizeStyle computed:', {
              fontSize: settingsStore.fontSize,
              style: `font-size: ${fontSize}`,
              deviceWidth: window.innerWidth,
              isSmallDevice
            });
            return { fontSize: fontSize, backgroundColor: settingsStore.quranBackgroundColor };
          });

          const currentSurahName = computed(() => {
            if (!quranData.value || !currentPageWords.value || currentPageWords.value.length === 0) {
              return 'Quran Content';
            }

            // Extract surah number from the first word of current page
            for (const line of currentPageWords.value) {
              if (line.words && line.words.length > 0) {
                const firstWord = line.words[0];
                if (firstWord && firstWord.surah) {
                  const surahNum = Number(firstWord.surah) || 0;
                  // Return zero-padded numeric token (e.g. '001surah') so the surah_name font renders correctly
                  return String(surahNum).padStart(3, '0') + 'surah';
                }
              }
            }

            return 'Quran Content';
          });

          const currentSurahNumber = computed(() => {
            if (!quranData.value || !currentPageWords.value || currentPageWords.value.length === 0) {
              return null;
            }
            
            // Extract surah number from the first word of current page
            for (const line of currentPageWords.value) {
              if (line.words && line.words.length > 0) {
                const firstWord = line.words[0];
                if (firstWord && firstWord.surah) {
                  return firstWord.surah;
                }
              }
            }
            
            return null;
          });

          const currentLocaleSurahs = computed(() => {
            const messages = i18nState.messages[currentLocale.value];
            return (messages && messages.surahs) ? messages.surahs : {};
          });

          const remainingDailyTasks = computed(() => {
            if (!dailyGoalsStore.todayGoal || !dailyGoalsStore.todayGoal.tasks) {
              return 0;
            }
            const total = Object.keys(dailyGoalsStore.todayGoal.tasks).length;
            const completed = Object.values(dailyGoalsStore.todayGoal.tasks).filter(task => task.completed).length;
            return Math.max(0, total - completed);
          });

          // Check if user has any daily tasks enabled
          const hasDailyTasks = computed(() => {
            return dailyGoalsStore.selectedTasks && dailyGoalsStore.selectedTasks.length > 0;
          });

          // Check if there are pending (incomplete) daily tasks
          const hasPendingDailyTasks = computed(() => {
            if (!hasDailyTasks.value || !dailyGoalsStore.todayGoal || !dailyGoalsStore.todayGoal.tasks) {
              return false;
            }
            const tasks = dailyGoalsStore.todayGoal.tasks;
            return Object.values(tasks).some(task => !task.completed);
          });

          // Check if device is small (mobile/tablet)
          const isSmallDevice = computed(() => {
            return viewportWidth.value < 768;
          });

          // Calculate total score from perfect revisions using hasanah values
          const totalPerfectRevisionsPoints = computed(() => {
            const perfectRevisionsData = Object.fromEntries(perfectRevisionsStore.perfectRevisions);
            return calculateTotalScore(perfectRevisionsData);
          });

          // Format the total score for display
          const formattedTotalScore = computed(() => {
            return formatScore(totalPerfectRevisionsPoints.value);
          });

          const perfectRevisionsCount = computed(() => {
            return perfectRevisionsStore.perfectRevisions.size;
          });

          const statistics = computed(() => {
            return calculateStatistics({
              memorized: memorizedStore.memorizedPages.size,
              mistakes: Array.from(mistakesStore.mistakes.values()).reduce((sum, set) => sum + set.size, 0),
              audios: audioStore.recordings.length,
              perfectRevisions: perfectRevisionsCount.value,
              totalPoints: totalPerfectRevisionsPoints.value
            });
          });

          const pagesWithMistakes = computed(() => {
            // Get all pages that have mistakes (with count > 0), sorted by page number
            const pages = Array.from(mistakesStore.mistakes.keys())
              .filter(pageNum => mistakesStore.mistakes.get(pageNum).size > 0)
              .sort((a, b) => a - b);
            return pages.map(pageNum => ({
              pageNumber: pageNum,
              mistakeCount: mistakesStore.mistakes.get(pageNum).size
            }));
          });

          // Get page dots visualization data for Tab 2 (page-by-page view)
          const pageDotsVisualization = computed(() => {
            const juzBoxes = [];
            for (let juzNum = 1; juzNum <= 30; juzNum++) {
              const [startPage, endPage] = getJuzRange(juzNum);
              const pages = [];
              for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                const perfectCount = getPerfectCount(pageNum);
                pages.push({
                  pageNum,
                  perfectCount,
                  gradientColor: getPageDotColor(perfectCount)
                });
              }
              juzBoxes.push({
                juzNum,
                pages,
                totalPages: endPage - startPage + 1
              });
            }
            return juzBoxes;
          });

          // Get gradient color for page dot based on perfect count
          // 0 = light gray, 1-39 = light to dark green gradient, 40+ = darkest green
          const getPageDotColor = (perfectCount) => {
            if (perfectCount === 0) {
              return '#d1d5db'; // Light gray - no progress
            }
            
            // Scale from 1-100 to gradient
            // For 1-39: light green to medium green
            // For 40-100: medium green to darkest green
            const score = Math.min(perfectCount, 100); // Cap at 100
            
            if (score < 40) {
              // Light green to medium green (1-39)
              // Interpolate between #a7f3d0 (light green) and #34d399 (medium green)
              const ratio = score / 40;
              const r = Math.round(167 - (167 - 52) * ratio); // 167 to 52
              const g = Math.round(243 - (243 - 211) * ratio); // 243 to 211
              const b = Math.round(208 - (208 - 153) * ratio); // 208 to 153
              return `rgb(${r}, ${g}, ${b})`;
            } else if (score < 70) {
              // Medium green to darker green (40-69)
              // Interpolate between #34d399 (medium green) and #059669 (darker green)
              const ratio = (score - 40) / 30;
              const r = Math.round(52 - (52 - 5) * ratio); // 52 to 5
              const g = Math.round(211 - (211 - 150) * ratio); // 211 to 150
              const b = Math.round(153 - (153 - 105) * ratio); // 153 to 105
              return `rgb(${r}, ${g}, ${b})`;
            } else {
              // Darker green to darkest green (70-100)
              // Interpolate between #059669 (darker green) and #065f46 (darkest green)
              const ratio = (score - 70) / 30;
              const r = Math.round(5 - (5 - 6) * ratio); // 5 to 6
              const g = Math.round(150 - (150 - 95) * ratio); // 150 to 95
              const b = Math.round(105 - (105 - 70) * ratio); // 105 to 70
              return `rgb(${r}, ${g}, ${b})`;
            }
          };

          const recentRecordings = computed(() => {
            const recent = audioStore.recordings.slice(-5).reverse();
            Logger.log('[Murajah] recentRecordings computed, returning:', recent.map(r => ({
              pageNumber: r.pageNumber,
              duration: r.duration,
              durationType: typeof r.duration
            })));
            return recent;
          });

          const formattedCompletion = computed(() => {
            const estimate = estimateCompletionDate(statistics.value.remaining, settingsStore.pagesPerDay);
            return estimate ? formatDate(estimate) : 'N/A';
          });

          const currentJuzProgress = computed(() => {
            // Find which Juz the current page belongs to
            let juzNum = 1;
            for (let j = 1; j <= 30; j++) {
              const [start, end] = getJuzRange(j);
              if (appStore.currentPage >= start && appStore.currentPage <= end) {
                juzNum = j;
                break;
              }
            }
            const [startPage, endPage] = getJuzRange(juzNum);
            let count = 0;
            for (let i = startPage; i < appStore.currentPage && i <= endPage; i++) {
              if (memorizedStore.memorizedPages.has(i)) count++;
            }
            return count;
          });

          // Get current page text on demand
          const currentPageText = computed(() => {
            if (!quranData.value || !quranData.value.layout || !quranData.value.words) {
              return [];
            }
            return getPageText(appStore.currentPage, quranData.value.layout, quranData.value.words);
          });

          // Get current page words with word-by-word detail
          const currentPageWords = computed(() => {
            if (!quranData.value || !quranData.value.layout || !quranData.value.words) {
              return [];
            }
            return getPageWordsDetailed(appStore.currentPage, quranData.value.layout, quranData.value.words);
          });

          // Get Arabic text for a specific verse (uses cached index — O(1) per verse)
          const getVerseText = (surahNum, ayahNum) => {
            if (!quranData.value || !quranData.value.words) {
              return '';
            }
            return _getVerseText(surahNum, ayahNum, quranData.value.words, settingsStore.layout);
          };

          // Get current page tafsir entries (switches based on locale)
          const currentPageTafsir = computed(() => {
            const tafsirData = i18nState.currentLocale === 'bn' 
              ? quranData.value?.tafsirBn 
              : i18nState.currentLocale === 'ar'
                ? quranData.value?.tafsirAr
                : quranData.value?.tafsirEn;
            if (!quranData.value || !tafsirData || !quranData.value.tafsirMapping) {
              return [];
            }
            const pageNum = String(appStore.currentPage);
            const ayahRefs = quranData.value.tafsirMapping[pageNum] || [];
            return ayahRefs.map(ref => {
              const tafsirEntry = tafsirData[ref];
              if (tafsirEntry) {
                const [surah, verse] = ref.split(':');
                return {
                  ref,
                  surah: parseInt(surah),
                  verse: parseInt(verse),
                  text: tafsirEntry.text,
                  arabicText: getVerseText(parseInt(surah), parseInt(verse))
                };
              }
              return null;
            }).filter(Boolean);
          });

          // Tafsir section state
          const tafsirExpanded = ref(true);
          const expandedTafsirItems = ref(new Set());
          
          const toggleTafsirItem = (ref) => {
            if (expandedTafsirItems.value.has(ref)) {
              expandedTafsirItems.value.delete(ref);
            } else {
              expandedTafsirItems.value.add(ref);
            }
          };
          
          const isTafsirItemExpanded = (ref) => {
            return expandedTafsirItems.value.has(ref);
          };

          // Load font dynamically for current page
          const loadPageFont = (pageNum) => {
            // For Indopak layout, we use a single font file (already loaded via @font-face)
            // so we don't need to load per-page fonts
            if (isIndopak.value) {
              Logger.log(`[Murajah] Indopak layout uses single font file - no per-page font needed`);
              return;
            }
            
            // Use settingsStore to check if tajweed is enabled
            const tajweed = settingsStore.tajweedEnabled;
            
            // Use unique IDs for QPC and Tajweed fonts to prevent mixing
            const qpcFontId = 'dynamicQPCPageFont';
            const tajweedFontId = 'dynamicTajweedPageFont';
            
            // Remove the old font style tags (both types)
            const oldQpc = document.getElementById(qpcFontId);
            const oldTajweed = document.getElementById(tajweedFontId);
            if (oldQpc) oldQpc.remove();
            if (oldTajweed) oldTajweed.remove();
            
            const styleTag = document.createElement('style');
            
            if (tajweed) {
              styleTag.id = tajweedFontId;

            } else {
              styleTag.id = qpcFontId;
              styleTag.innerHTML = `@font-face { font-family: 'QPCPage'; src: url('./resources/styles/fonts/qpc-v2/p${pageNum}.woff2') format('woff2'); font-weight: normal; font-style: normal; font-display: swap; }`;
            }
            
            document.head.appendChild(styleTag);
            Logger.log(`[Murajah] Loaded font for page ${pageNum} (tajweed: ${tajweed})`);
          };

          // ===== Calendar View Functions =====
          const getDayStatus = (date) => {
            // Check if this is today's date
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;
            
            // For today, check todayGoal first
            if (date === todayStr && dailyGoalsStore.todayGoal) {
              const tasks = Object.values(dailyGoalsStore.todayGoal.tasks);
              // Use the number of tasks in todayGoal.tasks (the tasks that were created for today)
              const totalTasksForToday = tasks.length;
              const completedCount = tasks.filter(t => t.completed).length;
              
              if (completedCount === totalTasksForToday && totalTasksForToday > 0) return 'complete';
              if (completedCount > 0) return 'partial';
              return 'none';
            }
            
            // For other dates, find goal in history
            const goal = dailyGoalsStore.goalHistory.find(g => g.date === date);
            if (!goal) return 'none'; // No goal recorded
            
            const tasks = Object.values(goal.tasks);
            // Use the number of tasks that were created for that day (not current selectedTasks)
            const totalTasksForDay = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            
            if (completedCount === totalTasksForDay && totalTasksForDay > 0) return 'complete'; // All tasks done
            if (completedCount > 0) return 'partial'; // Some tasks done
            return 'none'; // No tasks done
          };

          // Analytics Dashboard Computed Properties
          const completedDays = computed(() => {
            return dailyGoalsStore.goalHistory.filter(g => {
              const tasks = Object.values(g.tasks);
              const completed = tasks.filter(t => t.completed).length;
              return completed === dailyGoalsStore.selectedTasks.length && dailyGoalsStore.selectedTasks.length > 0;
            }).length;
          });

          const totalDays = computed(() => {
            // Count days with goalHistory + today if has todayGoal
            let total = dailyGoalsStore.goalHistory.length;
            if (dailyGoalsStore.todayGoal) total += 1;
            return total;
          });

          const completionRate = computed(() => {
            if (totalDays.value === 0) return 0;
            return Math.round((completedDays.value / totalDays.value) * 100);
          });

          const streakMessage = computed(() => {
            const streak = dailyGoalsStore.streak;
            if (streak === 0) return 'Start your streak today!';
            if (streak === 1) return '1 day strong';
            if (streak < 7) return `${streak} days going`;
            if (streak < 30) return `${Math.floor(streak / 7)} weeks strong`;
            return `${Math.floor(streak / 30)} months strong`;
          });

          // Breakdown percentages
          const completePercentage = computed(() => {
            if (totalDays.value === 0) return 0;
            return Math.round((completedDays.value / totalDays.value) * 100);
          });

          const partialDays = computed(() => {
            return dailyGoalsStore.goalHistory.filter(g => {
              const tasks = Object.values(g.tasks);
              const completed = tasks.filter(t => t.completed).length;
              return completed > 0 && completed < dailyGoalsStore.selectedTasks.length;
            }).length;
          });

          const partialPercentage = computed(() => {
            if (totalDays.value === 0) return 0;
            return Math.round((partialDays.value / totalDays.value) * 100);
          });

          const nonePercentage = computed(() => {
            return 100 - completePercentage.value - partialPercentage.value;
          });

          // Last 30 days trend
          const last30DaysTrend = computed(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const trend = [];

            for (let i = 29; i >= 0; i--) {
              const date = new Date(today);
              date.setDate(date.getDate() - i);
              const dateStr = date.toISOString().split('T')[0];

              // Check today's goal first
              if (dateStr === today.toISOString().split('T')[0] && dailyGoalsStore.todayGoal) {
                const tasks = Object.values(dailyGoalsStore.todayGoal.tasks);
                const completed = tasks.filter(t => t.completed).length;
                if (completed === dailyGoalsStore.selectedTasks.length && dailyGoalsStore.selectedTasks.length > 0) {
                  trend.push('complete');
                } else if (completed > 0) {
                  trend.push('partial');
                } else {
                  trend.push('none');
                }
              } else {
                // Check history
                const goal = dailyGoalsStore.goalHistory.find(g => g.date === dateStr);
                if (goal) {
                  const tasks = Object.values(goal.tasks);
                  const completed = tasks.filter(t => t.completed).length;
                  if (completed === dailyGoalsStore.selectedTasks.length && dailyGoalsStore.selectedTasks.length > 0) {
                    trend.push('complete');
                  } else if (completed > 0) {
                    trend.push('partial');
                  } else {
                    trend.push('none');
                  }
                } else {
                  trend.push('none');
                }
              }
            }

            return trend;
          });

          // Recent activity log
          const recentActivity = computed(() => {
            const activities = [];

            // Add completion activities from last 7 days
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            dailyGoalsStore.goalHistory.slice(-7).forEach(goal => {
              const tasks = Object.values(goal.tasks);
              const completed = tasks.filter(t => t.completed).length;
              
              if (completed > 0) {
                const goalDate = new Date(goal.date);
                const isToday = goal.date === today.toISOString().split('T')[0];
                const isYesterday = goal.date === new Date(today.getTime() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                let dateText = goalDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                if (isToday) dateText = 'Today';
                else if (isYesterday) dateText = 'Yesterday';

                activities.push({
                  text: `${completed}/${dailyGoalsStore.selectedTasks.length} tasks completed`,
                  date: dateText,
                  icon: 'fa-check-circle',
                  color: completed === dailyGoalsStore.selectedTasks.length ? 'text-green-600' : 'text-yellow-600'
                });
              }
            });

            return activities.reverse();
          });

          // Helper method for trend tooltip
          const getTrendDayTooltip = (index, status) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const date = new Date(today);
            date.setDate(date.getDate() - (29 - index));
            const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return `${dateStr}: ${status}`;
          };

          const getDayStatusColor = (status) => {
            switch (status) {
              case 'complete':
                return 'bg-green-500 hover:bg-green-600'; // Green for all tasks
              case 'partial':
                return 'bg-yellow-400 hover:bg-yellow-500'; // Yellow for some tasks
              case 'none':
              default:
                return 'bg-gray-200  hover:bg-gray-300'; // Gray for none
            }
          };

          const getDayTooltip = (date) => {
            // Check if this is today's date
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];
            
            // For today, use todayGoal
            if (date === todayStr && dailyGoalsStore.todayGoal) {
              const tasks = Object.values(dailyGoalsStore.todayGoal.tasks);
              const completed = tasks.filter(t => t.completed).length;
              const total = dailyGoalsStore.selectedTasks.length;
              return `${completed}/${total} tasks completed on ${new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}`;
            }
            
            // For other dates, find in history
            const goal = dailyGoalsStore.goalHistory.find(g => g.date === date);
            if (!goal) return 'No goal';
            
            const tasks = Object.values(goal.tasks);
            const completed = tasks.filter(t => t.completed).length;
            const total = dailyGoalsStore.selectedTasks.length;
            
            return `${completed}/${total} tasks completed on ${new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}`;
          };

          // GitHub-style contribution graph: Last 365 days or 6 months for small devices
          const contributionGraph = computed(() => {
            // Last 365 days or 6 months for small devices
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;
            const endDate = new Date(today);
            const startDate = new Date(today);
            if (isSmallDevice.value) {
              // For small devices, show last 6 months
              startDate.setMonth(startDate.getMonth() - 5);
            } else {
              // Otherwise, show last 12 months (365 days)
              startDate.setDate(startDate.getDate() - 364);
            }
            
            // Start with the actual first day (no padding at start)
            const weeks = [];
            let currentWeek = [];
            let currentDate = new Date(startDate);
            
            // Add all 365 days
            while (currentDate <= endDate) {
              const dateYear = currentDate.getFullYear();
              const dateMonth = String(currentDate.getMonth() + 1).padStart(2, '0');
              const dateDay = String(currentDate.getDate()).padStart(2, '0');
              const dateStr = `${dateYear}-${dateMonth}-${dateDay}`;
              const status = getDayStatus(dateStr);
              
              currentWeek.push({
                date: dateStr,
                dateObj: new Date(currentDate),
                status: status,
                tooltip: getDayTooltip(dateStr)
              });
              
              // Start new week on Sunday (7 items per week)
              if (currentWeek.length === 7) {
                weeks.push([...currentWeek]);
                currentWeek = [];
              }
              
              currentDate.setDate(currentDate.getDate() + 1);
            }
            
            // Add remaining partial week with padding at the END
            if (currentWeek.length > 0) {
              // Pad with empty days at end to complete the week
              while (currentWeek.length < 7) {
                currentWeek.push(null);
              }
              weeks.push(currentWeek);
            }
            
            return weeks;
          });

          // Month labels for GitHub-style graph (last 365 days or 180 days for small devices)
          const monthLabels = computed(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const endDate = new Date(today);
            const startDate = new Date(today);
            if (isSmallDevice.value) {
              // For small devices, show last 6 months
              startDate.setMonth(startDate.getMonth() - 5);
            } else {
              // Otherwise, show last 12 months (365 days)
              startDate.setDate(startDate.getDate() - 364);
            }
            
            const labels = [];
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            let currentDate = new Date(startDate);
            let lastMonth = -1;
            let dayCount = 0; // Days since start
            
            // Add labels for each month that appears in the range
            while (currentDate <= endDate) {
              const month = currentDate.getMonth();
              
              // If month changed and we haven't added label yet
              if (month !== lastMonth) {
                // Calculate which week this month starts in (day count / 7)
                const monthWeek = Math.floor(dayCount / 7);
                labels.push({
                  name: monthNames[month],
                  weekIndex: monthWeek
                });
                lastMonth = month;
              }
              
              currentDate.setDate(currentDate.getDate() + 1);
              dayCount++;
            }
            
            return labels;
          });

          // Function to reload Surah View fonts when font settings change
          const reloadSurahViewFonts = () => {

            const existingFonts = document.querySelectorAll('[id^="surahViewFont-"]');
            existingFonts.forEach(font => font.remove());

            surahViewState.loadedFonts = new Set();
            
            // Reload fonts for all currently loaded pages
            surahViewState.pages.forEach(page => {
              loadSurahViewPageFont(page.pageNum);
            });
            
            Logger.log('[Murajah] Surah View fonts reloaded');

          // Watch fontSize setting and save changes
          watch(() => settingsStore.fontSize, (newFontSize) => {
            saveDataBackground();
          });

          // Keyboard shortcuts handler
          const handleKeyboardShortcut = (event) => {
            // Don't trigger shortcuts if user is typing in an input field
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
              return;
            }

            // Don't trigger shortcuts if Ctrl, Cmd, or Alt are pressed (let browser handle these)
            if (event.ctrlKey || event.metaKey || event.altKey) {
              return;
            }

            const key = event.key.toLowerCase();
            
            // T - Toggle Tajweed (only for QPC layout)
            if (key === 't') {
              event.preventDefault();
              if (isIndopak.value) {
                appStore.errorMessage = 'Tajweed is not available for Indopak layout';
                setTimeout(() => appStore.errorMessage = '', 2000);
                return;
              }
              settingsStore.tajweedEnabled = !settingsStore.tajweedEnabled;
              updateSettings();
              appStore.successMessage = `Tajweed ${settingsStore.tajweedEnabled ? 'enabled' : 'disabled'}`;
              setTimeout(() => appStore.successMessage = '', 2000);
            }
            
            // Left Arrow - Previous Page (or Previous Surah/Juz in their respective views)
            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              // If in Surah View with a juz selected, go to previous juz
              if (settingsStore.showSurahView && surahViewState.selectedJuz) {
                const currentJuz = surahViewState.selectedJuz;
                if (currentJuz > 1) {
                  selectJuz(currentJuz - 1);
                  appStore.successMessage = `Juz ${currentJuz - 1}`;
                  setTimeout(() => appStore.successMessage = '', 1500);
                } else {
                  appStore.successMessage = 'Already at first juz';
                  setTimeout(() => appStore.successMessage = '', 1500);
                }
              }
              // If in Surah View with a surah selected, go to previous surah
              else if (settingsStore.showSurahView && surahViewState.selectedSurah) {
                const currentSurah = surahViewState.selectedSurah;
                if (currentSurah > 1) {
                  selectSurah(currentSurah - 1);
                  appStore.successMessage = `Surah ${currentSurah - 1}`;
                  setTimeout(() => appStore.successMessage = '', 1500);
                } else {
                  appStore.successMessage = 'Already at first surah';
                  setTimeout(() => appStore.successMessage = '', 1500);
                }
              } else {
                previousPage();
              }
            }
            
            // Right Arrow - Next Page (or Next Surah/Juz in their respective views)
            if (event.key === 'ArrowRight') {
              event.preventDefault();
              // If in Surah View with a juz selected, go to next juz
              if (settingsStore.showSurahView && surahViewState.selectedJuz) {
                const currentJuz = surahViewState.selectedJuz;
                if (currentJuz < 30) {
                  selectJuz(currentJuz + 1);
                  appStore.successMessage = `Juz ${currentJuz + 1}`;
                  setTimeout(() => appStore.successMessage = '', 1500);

                  appStore.successMessage = 'Already at last juz';

              // If in Surah View with a surah selected, go to next surah
              else if (settingsStore.showSurahView && surahViewState.selectedSurah) {

                if (currentSurah < 114) {
                  selectSurah(currentSurah + 1);

                  setTimeout(() => appStore.successMessage = '', 1500);
                } else {
                  appStore.successMessage = 'Already at last surah';
                  setTimeout(() => appStore.successMessage = '', 1500);
                }
              } else {
                nextPage();
              }
            }
            
            // M - Toggle Memorized
            if (key === 'm') {
              event.preventDefault();
              toggleMemorized();
            }
            
            // P - Perfect Revision
            if (key === 'p') {
              event.preventDefault();

      app.mount('#app');
      const initialLoader = document.getElementById('initial-loader');
      if (initialLoader) {
        initialLoader.style.opacity = '0';
        setTimeout(() => {
          initialLoader.remove();
        }, 300);
      }
      // Mark successful load — clears crash-loop detection
      try { sessionStorage.setItem('murajah-load-success', Date.now().toString()); } catch(e) {}
      // Cancel the initialization timeout
      if (window.__murajahCancelInitTimeout) window.__murajahCancelInitTimeout();
    })();
  } catch (initError) {
    // Outer error boundary — catches module import failures, IndexedDB errors, etc.
    console.error('[Murajah] Fatal initialization error:', initError);
    const loader = document.getElementById('initial-loader');
    if (loader) loader.style.display = 'none';
    const errorDiv = document.getElementById('init-error');
    if (errorDiv) {
      errorDiv.style.display = '';
      const detail = document.getElementById('init-error-detail');
      if (detail) detail.textContent = initError?.message || 'Unknown error during startup';
    }
    // Cancel the timeout since we're already showing error UI
    if (window.__murajahCancelInitTimeout) window.__murajahCancelInitTimeout();
  }

  <!-- Service Worker Registration for Offline Support -->
  <script>
    // Register Service Worker for PWA/Offline functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js', {
            scope: './'
          });
          
          console.log('[Murajah] Service Worker registered:', registration.scope);
          
          // Check for updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('[Murajah] Service Worker update found');
            
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available
                console.log('[Murajah] New version available');
                // Show update notification to user
                if (window.showUpdateNotification) {
                  window.showUpdateNotification();
                }
              }
            });
          });
          
          // Listen for controller change (new SW activated)
          // Auto-reload to avoid old HTML + new JS module mismatch that causes "failed to load"
          // Coordinates with refreshApp() to prevent double-reload races
          let reloadingForSWUpdate = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[Murajah] Service Worker controller changed');
            if (reloadingForSWUpdate) return;

            // If the app hasn't finished mounting (initial-loader still visible), delay reload
            // to avoid reload loops when SW installs during first-ever page load
            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader && initialLoader.parentNode && !window.__murajahManualRefresh) {
              console.log('[Murajah] Skipping auto-reload — app still initializing (first install)');
              return;
            }

            // Debounce: small delay to prevent double-reload with refreshApp()
            setTimeout(() => {
              if (reloadingForSWUpdate) return;
              reloadingForSWUpdate = true;
              window.__murajahReloadTriggered = true;
              console.log('[Murajah] Reloading for SW update');
              window.location.reload();
            }, 200);
          });
          
          // Listen for content update messages from SW (stale-while-revalidate)
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'CONTENT_UPDATED') {
              console.log('[Murajah] Content updated in background:', event.data.url);
              // For HTML updates, show update banner so user gets latest version
              if (event.data.url?.endsWith('.html') && window.showUpdateNotification) {
                window.showUpdateNotification();
              }
            }
          });
          
        } catch (error) {
          console.warn('[Murajah] Service Worker registration failed:', error);
        }
      });
      
      // Expose functions for communicating with Service Worker
      window.swCacheFonts = (pages) => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'CACHE_FONTS',
            payload: { pages }
          });
        }
      };
      
      window.swCacheSecondary = () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'CACHE_SECONDARY'
          });
        }
      };
      
      window.swGetCacheStatus = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'GET_CACHE_STATUS' },
            [messageChannel.port2]
          );
        });
      };
      
      window.swClearCache = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(false);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = () => {
            resolve(true);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'CLEAR_CACHE' },
            [messageChannel.port2]
          );
        });
      };
      
      // Debug: List cached fonts
      window.swDebugFontCache = () => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            Logger.log('[Murajah Debug] Font cache:', event.data.payload);
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'DEBUG_FONT_CACHE' },
            [messageChannel.port2]
          );
        });
      };
      
      // Debug: Test if a font URL can be matched in cache
      window.swTestFontMatch = (url) => {
        return new Promise((resolve) => {
          if (!navigator.serviceWorker.controller) {
            resolve(null);
            return;
          }
          
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            Logger.log('[Murajah Debug] Font match result:', event.data.payload);
            resolve(event.data.payload);
          };
          
          navigator.serviceWorker.controller.postMessage(
            { type: 'TEST_FONT_MATCH', url },
            [messageChannel.port2]
          );
        });
      };
    }
    
    // Online/Offline status tracking
    window.addEventListener('online', () => {
      Logger.log('[Murajah] Back online');
      document.body.classList.remove('offline-mode');
      if (window.updateOnlineStatus) {
        window.updateOnlineStatus(true);
      }
    });
    
    window.addEventListener('offline', () => {
      Logger.log('[Murajah] Gone offline');
      document.body.classList.add('offline-mode');
      if (window.updateOnlineStatus) {
        window.updateOnlineStatus(false);
      }
    });
  </script>
