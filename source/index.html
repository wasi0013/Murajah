    .hover\:bg-yellow-600:hover,
    .hover\:bg-red-600:hover {
      color: white !important;
    }

    /* Dark mode overrides for -500 buttons */
    .dark-mode .bg-yellow-500,
    .dark-mode .bg-red-500 {

    }

    .dark-mode .bg-yellow-500 span,
    .dark-mode .bg-red-500 span {
      color: white !important;
    }

    .dark-mode .bg-yellow-500 i,
    .dark-mode .bg-red-500 i {

    .dark-mode .hover\:bg-red-600:hover {

    /* ===== CUSTOM TOOLTIP STYLING ===== */
    .word-tooltip {
      position: fixed;
      background-color: #fef3c7;
      color: #1f2937;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      pointer-events: none;
      z-index: 10000;
      max-width: 300px;
      word-wrap: break-word;
      white-space: normal;
      font-size: 0.875rem;
      font-weight: 500;
      transform: translateX(-50%);
      line-height: 1.5;
      border: 1px solid #fde68a;
    }

    .dark-mode .word-tooltip {
      background-color: #fef3c7;
      color: #1f2937;
      border: 1px solid #fde68a;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* Arrow pointing down */
    .word-tooltip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #fef3c7;
    }

    .dark-mode .word-tooltip::after {
      border-top-color: #fef3c7;
    }

    /* Recording Countdown Overlay */
    .recording-countdown-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      animation: fadeIn 0.3s ease-out;
    }

    .countdown-timer {
      font-size: 6rem;
      font-weight: bold;
      color: white;
      text-align: center;
      animation: countdownPulse 0.6s ease-in-out;
    }

    @keyframes countdownPulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Review Pages Overlay */
    .review-pages-overlay {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(96, 165, 250, 0.95));
      border-radius: 0.75rem;
      padding: 1rem;
      max-width: 350px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      animation: slideInUp 0.3s ease-out;
      z-index: 30;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes slideInUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .review-pages-overlay h4 {
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0 0 0.75rem 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .review-pages-overlay .pages-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .review-pages-overlay .page-tag {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.35rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .review-pages-overlay .page-tag:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .review-pages-overlay .page-tag:active {
      transform: translateY(0);
    }

    .review-pages-overlay .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .review-pages-overlay .close-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Analytics Tabs */
    .analytics-tabs {
      display: flex;
      gap: 2rem;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 1.5rem;
    }

    .dark-mode .analytics-tabs {
      border-bottom-color: #e5e7eb;
    }

    .analytics-tab-btn {
      background: none;
      border: none;
      padding: 0.75rem 0;
      font-size: 1rem;
      font-weight: 500;
      color: #9ca3af;

      position: relative;
      transition: color 0.3s ease;
    }

    }

    .analytics-tab-btn.active {
      color: #3b82f6;
    }

    .analytics-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: #3b82f6;
    }

    .dark-mode .analytics-tab-btn {
      color: #9ca3af;
    }

    .dark-mode .analytics-tab-btn:hover {
      color: #3b82f6;
    }

    .dark-mode .analytics-tab-btn.active {
      color: #3b82f6;
    }

    .dark-mode .analytics-tab-btn.active::after {
      background: #3b82f6;
    }

    /* Page Dots Visualization */
    .page-dots-visualization {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 768px) {

        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 1rem;
      }
    }

    .juz-box {
      background: #f9fafb;
      border-radius: 0.5rem;
      padding: 1rem;
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 768px) {

        padding: 0.75rem;
      }
    }

    .dark-mode .juz-box {
      background: #f9fafb;

    }

    .juz-box-header {
      font-size: 0.875rem;
      font-weight: 600;

      text-align: center;

    .dark-mode .juz-box-header {

    }

    .page-dots-grid {

    @media (max-width: 768px) {

    }

    .page-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;

    /* Blur effect for Quran text section during recording */

    }

    /* Navbar Dropdown Styles */
    .nav-dropdown {
      position: relative;
      display: inline-block;
    }

    .nav-dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 200px;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid #e5e7eb;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown.active .nav-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .nav-dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;

      text-decoration: none;
      transition: background-color 0.15s ease;

      border-radius: 0.5rem 0.5rem 0 0;
    }

    .nav-dropdown-item:last-child {
      border-radius: 0 0 0.5rem 0.5rem;
    }

    .nav-dropdown-item:hover {
      background-color: #f3f4f6;
    }

    .nav-dropdown-item i {
      width: 1.25rem;
      text-align: center;

    /* Mobile Menu Styles */
    .mobile-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0s 0.3s;
      touch-action: none;
    }

    .mobile-menu-overlay.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0s 0s;
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      max-width: 85vw;
      height: 100vh;
      height: 100dvh;
      background: white;
      z-index: 9999;
      transform: translateX(-100%);
      transition: transform 0.3s ease, visibility 0s 0.3s;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      visibility: hidden;
    }

    .mobile-menu.active {
      transform: translateX(0);
      visibility: visible;
      transition: transform 0.3s ease, visibility 0s 0s;
    }

    /* Lock body scroll when mobile menu is open */
    body.mobile-menu-open {
      overflow: hidden;

    }

    .mobile-menu-header {

      align-items: center;

      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;

    }

    .mobile-menu-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      color: #374151;
      text-decoration: none;

      cursor: pointer;
    }

    .mobile-menu-item:hover {

    }

    }

      }

    @media (min-width: 768px) {
      .desktop-nav {
        display: flex;
      }
    }

    /* ===== MORPHOLOGY MODAL STYLES ===== */
    .morphology-modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(2px);
    }

    .morphology-modal {
      background: white;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #e5e7eb;
    }

    .morphology-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px;
      background: linear-gradient(to right, #eef2ff, #e0e7ff);
      border-bottom: 1px solid #c7d2fe;
    }

    .morphology-word-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .morphology-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e3a8a;
      margin: 0;
    }

    .morphology-word-ref {
      font-size: 0.85rem;
      color: #6366f1;
      font-weight: 500;
    }

    .morphology-close-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: white;
      border: 1px solid #c7d2fe;
      color: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }

    .morphology-close-btn:hover {
      background: #eef2ff;
      color: #4338ca;
      transform: scale(1.05);
    }

    .morphology-word-display {
      padding: 24px;
      background: linear-gradient(to bottom, #fafbff, #f5f7ff);
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .morphology-arabic-word {
      font-size: 3rem;
      color: #1e3a8a;
      line-height: 1.5;
      direction: rtl;
      text-align: center;
    }

    /* Font-specific classes for morphology modal */
    .morphology-arabic-word.font-indopak {
      font-family: 'IndopakNastaleeq', 'Noto Nastaliq Urdu', 'Traditional Arabic', serif;
      font-size: 3.5rem;
      line-height: 2;
    }

    .morphology-arabic-word.font-tajweed,
    .morphology-arabic-word.font-uthmani {
      /* Uses dynamic page font via inline style */
      font-size: 3rem;
      line-height: 1.5;
    }

    .morphology-modal-content {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
      min-height: 150px;
    }

    .morphology-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
      color: #6b7280;
      font-size: 1rem;
      text-align: center;
    }

    .morphology-loading {
      color: #6366f1;
    }

    .morphology-error {
      color: #dc2626;
    }

    .morphology-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #374151;
    }

    .morphology-text .ab {
      font-style: italic;
      color: #4338ca;
      font-weight: 500;
    }

    .morphology-text .at {
      font-family: 'Traditional Arabic', 'IndopakNastaleeq', serif;
      font-size: 1.2em;
      color: #1e3a8a;
      direction: rtl;
      unicode-bidi: bidi-override;
    }

    .morphology-modal-footer {
      padding: 16px 24px;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: flex-end;
    }

    .morphology-done-btn {
      padding: 10px 24px;
      background: linear-gradient(to right, #4f46e5, #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .morphology-done-btn:hover {
      background: linear-gradient(to right, #4338ca, #4f46e5);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Morphology modal transition */
    .morphology-modal-enter-active,
    .morphology-modal-leave-active {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .morphology-modal-enter-from,
    .morphology-modal-leave-to {
      opacity: 0;
    }

    .morphology-modal-enter-from .morphology-modal,
    .morphology-modal-leave-to .morphology-modal {
      transform: scale(0.9) translateY(20px);
    }

    @media (max-width: 640px) {

        font-size: 1.1rem;
      }

      .morphology-word-display {
        padding: 20px;
      }

      .morphology-arabic-word {
        font-size: 2.5rem;
      }

      .morphology-arabic-word.font-indopak {
        font-size: 2.75rem;
      }

      .morphology-modal-content {
        padding: 20px;
      }

      .morphology-text {

      }

      .morphology-modal-footer {
        padding: 12px 20px;
      }

      .morphology-done-btn {
        width: 100%;

      }

        <div style="display:flex;flex-direction:column;gap:0.75rem;align-items:center;">

            style="padding:0.75rem 1.5rem;background:#3b82f6;color:#fff;border:none;border-radius:0.5rem;font-size:0.95rem;font-weight:600;cursor:pointer;width:100%;max-width:220px;">

            style="padding:0.75rem 1.5rem;background:#dc2626;color:#fff;border:none;border-radius:0.5rem;font-size:0.95rem;font-weight:600;cursor:pointer;width:100%;max-width:220px;">
            Reset Cache &amp; Repair
          </button>

  <!-- Initialization timeout safety net (runs BEFORE module script) -->
  <script>
    (function() {
      var INIT_TIMEOUT_MS = 30000; // 30 seconds
      var timerId = setTimeout(function() {
        // If initial-loader is still in the DOM after 30s, app is stuck
        var loader = document.getElementById('initial-loader');
        if (loader && loader.parentNode) {
          console.error('[Murajah] Initialization timeout — app stuck for ' + INIT_TIMEOUT_MS + 'ms');
          loader.style.display = 'none';
          var errorDiv = document.getElementById('init-error');
          if (errorDiv) {
            errorDiv.style.display = '';
            var detail = document.getElementById('init-error-detail');
            if (detail) detail.textContent = 'The app took too long to load. This may be a network or caching issue.';
          }
        }
      }, INIT_TIMEOUT_MS);
      // Allow the module script to cancel the timeout on successful init
      window.__murajahCancelInitTimeout = function() {
        clearTimeout(timerId);
      };

      // Detect repeated crash loops: if last load attempt did not succeed, show recovery immediately
      try {
        var lastAttempt = sessionStorage.getItem('murajah-load-attempt');
        var lastSuccess = sessionStorage.getItem('murajah-load-success');
        if (lastAttempt && !lastSuccess) {
          var elapsed = Date.now() - parseInt(lastAttempt, 10);
          if (elapsed > 5000 && elapsed < 120000) {
            // Previous load crashed — show recovery UI immediately
            console.warn('[Murajah] Previous load attempt failed (' + elapsed + 'ms ago). Showing recovery UI.');
            var loader2 = document.getElementById('initial-loader');
            if (loader2) loader2.style.display = 'none';
            var errorDiv2 = document.getElementById('init-error');
            if (errorDiv2) {
              errorDiv2.style.display = '';
              var detail2 = document.getElementById('init-error-detail');
              if (detail2) detail2.textContent = 'The app failed to load on the previous attempt. You can retry or reset the cache.';
            }
            // Don't auto-reload — let user choose
            clearTimeout(timerId);
            return; // stop further execution in this script
          }
        }
        // Mark load attempt (will be cleared on success)
        sessionStorage.setItem('murajah-load-attempt', Date.now().toString());
        sessionStorage.removeItem('murajah-load-success');
      } catch (e) {
        // sessionStorage not available (private mode etc) — skip crash detection
      }
    })();
  </script>

  <script type="module">
    // Access Vue from global scope since it's loaded as a script tag
  const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

  try {
    // Centralized logger (DEBUG silent by default; enable via localStorage.setItem('murajah-debug', 'true'))
    const { default: Logger } = await import('./resources/js/utils/logger.js');

    // Touch helper for WebView compatibility
    const { createTouchHandler, createSwipeHandler, isTouchDevice: isTouchDeviceHelper } = await import('./resources/js/utils/touchHelper.js');

    // Handle ?freshstart=true from hotfix.html redirect
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('freshstart') === 'true') {
        // Remove the param from URL to prevent re-triggering on manual refresh
        urlParams.delete('freshstart');
        const cleanUrl = urlParams.toString()
          ? window.location.pathname + '?' + urlParams.toString()
          : window.location.pathname;
        window.history.replaceState({}, '', cleanUrl);
        console.log('[Murajah] Fresh start after recovery — caches cleared');
      }
    } catch (e) { /* URL parsing error — ignore */ }

    // IIFE to handle async imports
    (async () => {
      // ==================== IndexedDB Manager ====================
      class MurajahDB {
        constructor() {
          this.dbName = 'murajah-db';
          this.version = 5; // Bumped version for notes store
          this.db = null;
        }

        async init() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);

            request.onerror = () => {
              const error = request.error;
              if (error?.name === 'VersionError') {
                // Requested version differs from existing DB version.
                // This can happen when the service worker serves cached older code.
                // NEVER delete the database — recover safely instead.
                console.warn('[Murajah] DB version mismatch — recovering without data loss...');
                this._handleVersionMismatch().then(resolve).catch(reject);
              } else {
                reject(error);
              }
            };
            request.onsuccess = () => {
              this.db = request.result;
              Logger.log('[Murajah] IndexedDB initialized v' + this.db.version);
              resolve();
            };

            request.onupgradeneeded = (event) => this._createSchema(event);
          });
        }

        /**
         * Safely handle VersionError without data loss.
         * Strategy:
         *   1. Open DB at whatever version it already has (no version = accept any)
         *   2. If all required stores exist → use as-is (most common case)
         *   3. If stores are missing → backup data, upgrade version to add them
         *   4. Only as absolute last resort → delete + recreate + restore from backup
         */
        async _handleVersionMismatch() {
          // Step 1: Open without specifying version — accepts whatever version exists
          let existingDB;
          try {
            existingDB = await new Promise((resolve, reject) => {
              const req = indexedDB.open(this.dbName);
              req.onerror = () => reject(req.error);
              req.onsuccess = () => resolve(req.result);
            });
          } catch (e) {
            // Can't even open the DB — nothing to lose, recreate fresh
            console.error('[Murajah] Cannot open existing DB at all:', e.message);
            await this._recreateDatabase();
            return;
          }

          const existingVersion = existingDB.version;
          const requiredStores = this._getRequiredStoreNames();
          const missingStores = requiredStores.filter(
            name => !existingDB.objectStoreNames.contains(name)
          );

          if (missingStores.length === 0) {
            // All required stores already exist — use the DB as-is.
            // This is the most common case: cached old code (v4) opens a v5 DB.
            this.db = existingDB;
            Logger.log(`[Murajah] Opened existing DB v${existingVersion} — all stores present, no migration needed`);
            return;
          }

          // Step 2: Some stores are missing — backup everything first
          Logger.log(`[Murajah] Missing stores: [${missingStores.join(', ')}] — upgrading with data preservation`);
          const backup = await this._exportAllData(existingDB);
          existingDB.close();

          // Step 3: Reopen at a higher version to trigger onupgradeneeded.
          // IndexedDB automatically preserves data in existing stores during upgrades.
          const upgradeVersion = Math.max(this.version, existingVersion + 1);
          try {
            await new Promise((resolve, reject) => {
              const req = indexedDB.open(this.dbName, upgradeVersion);
              req.onerror = () => reject(req.error);
              req.onsuccess = () => {
                this.db = req.result;
                resolve();
              };
              req.onupgradeneeded = (event) => this._createSchema(event);
            });
            Logger.log(`[Murajah] DB safely upgraded to v${this.db.version} — existing data preserved`);
            return;
          } catch (upgradeError) {
            console.error('[Murajah] In-place upgrade failed:', upgradeError.message);
          }

          // Step 4: Last resort — delete, recreate, and restore from backup
          console.warn('[Murajah] Last resort: recreating DB and restoring backup...');
          await this._recreateDatabase();

          if (backup && Object.keys(backup).length > 0) {
            const restored = await this._importData(backup);
            Logger.log(`[Murajah] Restored ${restored} records from backup after DB recreation`);
          }
        }

        /**
         * Export all data from every object store in the database.
         * Individual store failures are logged but don't block other stores.
         * Returns { storeName: [ ...records ] }
         */
        async _exportAllData(db) {
          const backup = {};
          const storeNames = Array.from(db.objectStoreNames);

          for (const storeName of storeNames) {
            try {
              backup[storeName] = await new Promise((resolve) => {
                const tx = db.transaction([storeName], 'readonly');
                const request = tx.objectStore(storeName).getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => {
                  console.warn(`[Murajah] Backup: could not read "${storeName}"`);
                  resolve([]);
                };
              });
            } catch (e) {
              console.warn(`[Murajah] Backup: skipped "${storeName}":`, e.message);
              backup[storeName] = [];
            }
          }

          const summary = Object.entries(backup)
            .filter(([, v]) => v.length > 0)
            .map(([k, v]) => `${k}(${v.length} records)`)
            .join(', ');
          Logger.log(`[Murajah] Backup complete: ${summary || '(empty database)'}`);
          return backup;
        }

        /**
         * Import backed-up data into the current database.
         * - Skips stores that don't exist in the current schema
         * - Skips individual records that are incompatible with the store's keyPath
         * - Returns the total number of records successfully restored
         */
        async _importData(backup) {
          let totalRestored = 0;

          for (const [storeName, records] of Object.entries(backup)) {
            if (!this.db.objectStoreNames.contains(storeName) || !records.length) continue;

            try {
              const tx = this.db.transaction([storeName], 'readwrite');
              const store = tx.objectStore(storeName);
              let storeCount = 0;

              for (const record of records) {
                try {
                  store.put(record);
                  storeCount++;
                } catch (e) {
                  // Record doesn't match store schema (e.g., missing keyPath)
                  console.warn(`[Murajah] Restore: skipped incompatible record in "${storeName}":`, e.message);
                }
              }

              await new Promise((resolve) => {
                tx.oncomplete = () => {
                  totalRestored += storeCount;
                  resolve();
                };
                tx.onerror = () => {
                  console.warn(`[Murajah] Restore: transaction failed for "${storeName}":`, tx.error?.message);
                  resolve(); // Don't block other stores
                };
              });
            } catch (e) {
              console.warn(`[Murajah] Restore: could not restore "${storeName}":`, e.message);
            }
          }

          return totalRestored;
        }

        /**
         * Delete and recreate the database from scratch.
         * Only called as an absolute last resort after data has been backed up.
         */
        async _recreateDatabase() {
          await new Promise((resolve) => {
            const req = indexedDB.deleteDatabase(this.dbName);
            req.onsuccess = resolve;
            req.onerror = resolve;
            req.onblocked = () => {
              console.warn('[Murajah] DB delete blocked — another connection may be open');
              resolve();
            };
          });

          await new Promise((resolve, reject) => {
            const req = indexedDB.open(this.dbName, this.version);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => {
              this.db = req.result;
              Logger.log('[Murajah] DB recreated fresh at v' + this.version);
              resolve();
            };
            req.onupgradeneeded = (event) => this._createSchema(event);
          });
        }

        /** All object stores required by the app */
        _getRequiredStoreNames() {
          return ['appData', 'recordings', 'dailyGoals', 'quranCache', 'resourceCache', 'notes'];
        }

        _createSchema(event) {
          const db = event.target.result;
          
          // Create object stores if they don't exist
          if (!db.objectStoreNames.contains('appData')) {
            db.createObjectStore('appData', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('recordings')) {
            db.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains('dailyGoals')) {
            db.createObjectStore('dailyGoals', { keyPath: 'date' });
          }
          if (!db.objectStoreNames.contains('quranCache')) {
            db.createObjectStore('quranCache', { keyPath: 'id' });
          }
          // New store for caching all static resources (JS, CSS, JSON, fonts)
          if (!db.objectStoreNames.contains('resourceCache')) {
            db.createObjectStore('resourceCache', { keyPath: 'id' });
          }
          // Notes store for user reflections and annotations
          if (!db.objectStoreNames.contains('notes')) {
            db.createObjectStore('notes', { keyPath: 'id' });
          }
          Logger.log('[Murajah] IndexedDB schema created/upgraded');
        }

                26: [505, 524], 27: [525, 545], 28: [546, 565], 29: [566, 585], 30: [586, 610]
              };
              return INDOPAK_JUZ_RANGES[juzNum] || [1, 21];
            }
            // QPC/Uthmani layout - use existing JUZ_RANGES
            return JUZ_RANGES[juzNum] || [1, 21];
          };

          // Live streaming state using YouTube embeds
          const liveContainer = ref(null);
          const liveActiveChannel = ref(null); // 'quran' | 'sunnah' | null
          const LIVE_URLS = {
            quran: 'https://www.youtube.com/embed/live_stream?channel=UCos52azQNBgW63_9uDJoPDA&autoplay=1',
            sunnah: 'https://www.youtube.com/embed/live_stream?channel=UCROKYPep-UuODNwyipe6JMw&autoplay=1'
          };

          // Remove iframe from container (non-destructive to `liveActiveChannel`)
          const destroyLiveEngine = () => {
            try {
              const container = liveContainer.value;
              if (container) {
                const iframe = container.querySelector('iframe');
                if (iframe) {
                  try { iframe.src = ''; } catch (e) { /* ignore */ }
                  container.removeChild(iframe);
                }
              }
            } catch (e) {
              console.warn('[Murajah][Live] Failed to destroy live engine', e);
            }
          };

          const stopLivePlayback = () => {
            try {
              destroyLiveEngine();
              try { liveActiveChannel.value = null; } catch (e) { /* ignore */ }
            } catch (e) {
              console.warn('[Murajah][Live] Failed to stop playback', e);
            }
          };

          const playChannel = async (channel) => {
            if (!LIVE_URLS[channel]) return;
            const url = LIVE_URLS[channel];
            const container = liveContainer.value;
            if (!container) {
              console.warn('[Murajah][Live] Embed container not mounted yet');
              liveActiveChannel.value = channel;
              return;
            }

            // If same channel clicked, toggle off
            if (liveActiveChannel.value === channel) {
              stopLivePlayback();
              return;
            }

            // Switch to new channel (playback only — do not change view mode)
            liveActiveChannel.value = channel;

            try {
              // remove previous embed
              destroyLiveEngine();

              const iframe = document.createElement('iframe');
              iframe.setAttribute('src', url);
              iframe.setAttribute('frameborder', '0');
              iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
              iframe.setAttribute('allowfullscreen', '');
              iframe.style.width = '100%';
              iframe.style.height = '100%';
              iframe.style.border = '0';
              iframe.className = 'w-full h-full';
              container.appendChild(iframe);
            } catch (e) {
              console.error('[Murajah][Live] Failed to play channel', e);
              appStore.errorMessage = 'Failed to start live stream';
              setTimeout(() => appStore.errorMessage = '', 3000);
            }
          };

          const handleTranslationUpdate = (freshTranslations) => {
            if (!freshTranslations || !quranData.value) {
              return;
            }
            quranData.value.translations = freshTranslations;
            Logger.log('[Murajah] Translations updated from background cache');
          };

          const updateViewportWidth = () => {
            if (typeof window !== 'undefined') {
              viewportWidth.value = window.innerWidth;
            }
          };

          onMounted(() => {
            updateViewportWidth();
            if (typeof window !== 'undefined') {
              window.addEventListener('resize', updateViewportWidth);
            }
          });

          onUnmounted(() => {
            if (typeof window !== 'undefined') {
              window.removeEventListener('resize', updateViewportWidth);
            }
          });

          const currentLocale = computed(() => i18nState.currentLocale);
          const helpStepItems = computed(() => {
            return Array.from({ length: 12 }, (_, idx) => {
              const translation = t(`helpModal.sections.stepProcess.item${idx + 1}`);
              return translation && translation !== `helpModal.sections.stepProcess.item${idx + 1}`
                ? translation
                : `Step ${idx + 1}`;
            });
          });
          const languageLabelKey = (locale) => {
            const map = {
              en: 'language.english',
              bn: 'language.bangla',
              ar: 'language.arabic'
            };
            return map[locale] || locale;
          };

          const handleLocaleChange = async (event) => {
            const nextLocale = event?.target?.value;
            if (nextLocale && nextLocale !== i18nState.currentLocale) {
              await setLocale(nextLocale, murajahDB);
            }
          };

          const handleLanguageSelect = async (locale) => {
            await setLocale(locale, murajahDB);
          };

          const hideLanguageSelectionModal = async () => {
            showLanguageSelectionModal.value = false;
            try {
              await murajahDB.setLanguageSelectionFlag();
              Logger.log('[Murajah] Language selection saved, modal closed');
            } catch (error) {
              console.error('[Murajah] Failed to save language selection flag:', error);
            }
          };

          const localeToggleLabel = computed(() => t('language.label'));
          const toggleLocale = async () => {
            const nextLocale = i18nState.currentLocale === 'bn' ? 'en' : 'bn';
            await setLocale(nextLocale, murajahDB);
          };

          // Scroll to section function for navbar navigation
          const scrollToSection = async (sectionId) => {
            showMobileMenu.value = false;
            showHomeDropdown.value = false;

            // Special handling for Live: open live view and remember previous
            if (sectionId === 'live-section') {
              if (viewMode.value !== 'live') {
                previousViewMode.value = viewMode.value;
                viewMode.value = 'live';
              }
              await nextTick();
              const elLive = document.getElementById(sectionId);
              if (elLive) elLive.scrollIntoView({ behavior: 'smooth', block: 'start' });
              // Auto-start Quran channel when opening Live (only if nothing playing)
              try {
                if (!liveActiveChannel.value) {
                  playChannel('quran');
                }
              } catch (e) {
                console.warn('[Murajah][Live] Auto-start failed', e);
              }
              return;
            }

            // If navigating away from Live (or navigating to any non-live section), stop live playback
            if (sectionId !== 'live-section' && liveActiveChannel.value) {
              try { stopLivePlayback(); } catch (e) { /* ignore */ }
              previousViewMode.value = null;
            }

            // Special handling for 'quran' section - user explicitly requested Quran
            if (sectionId === 'quran' || sectionId === 'quran-text-section') {
              // Mark that user explicitly chose Quran; keep Quran active across navigation
              forceQuranMode.value = true;
              viewMode.value = 'core';
              try {
                settingsStore.showTafsir = false;
                settingsStore.showWordByWord = false;
                settingsStore.showSurahView = false;
                await murajahDB.setSetting('showTafsir', false);
                await murajahDB.setSetting('showWordByWord', false);
                await murajahDB.setSetting('showSurahView', false);
              } catch (e) {
                settingsStore.showTafsir = false;
                settingsStore.showWordByWord = false;
                settingsStore.showSurahView = false;
              }
              // Remove tafsir and wordbyword params from URL (preserve other params)
              try {
                const url = new URL(window.location.href);
                if (url.searchParams.has('tafsir')) {
                  url.searchParams.delete('tafsir');
                }
                if (url.searchParams.has('wordbyword')) {
                  url.searchParams.delete('wordbyword');
                }
                if (url.searchParams.has('surahview')) {
                  url.searchParams.delete('surahview');
                }
                if (url.searchParams.has('surah')) {
                  url.searchParams.delete('surah');
                }
                if (url.searchParams.has('juz')) {
                  url.searchParams.delete('juz');
                }
                history.replaceState(null, '', url.toString());
                
                // Persist URL state to IndexedDB for session restoration
                murajahDB.saveUrlState({
                  page: appStore.currentPage,
                  tafsir: false,
                  wordbyword: false
                }).catch(err => console.warn('[Murajah] Failed to save URL state:', err));
              } catch (e) {
                // ignore URL errors
              }
              // Wait a tick to allow Vue to render the core view, then scroll to top
              await nextTick();
              window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }
            
            // Close surah view when navigating to any section that's not surah-section
            // This ensures clean state and URL parameters
            if (sectionId !== 'surah-section' && settingsStore.showSurahView) {
              closeSurahView();
            }
            
            // Determine view mode based on target section
            if (sectionId === 'analytics-section') {
              viewMode.value = 'analytics';
            } else if (sectionId === 'daily-goals-section' || sectionId === 'timeline-section') {
              viewMode.value = 'dailyGoals';
            } else {
              // quran, tafsir, audio, mistakes, quick test, recent recordings -> core
              viewMode.value = 'core';
            }

            // Special handling for tafsir - enable it and add URL param, then scroll to top
            if (sectionId === 'tafsir-section') {
              // Clear explicit Quran override so Tafsir stays active across navigation
              forceQuranMode.value = false;
              try {
                settingsStore.showTafsir = true;
                settingsStore.showWordByWord = false; // Disable word-by-word when tafsir is enabled
                settingsStore.showSurahView = false;
                await murajahDB.setSetting('showTafsir', true);
                await murajahDB.setSetting('showSurahView', false);
              } catch (e) {
                settingsStore.showTafsir = true;
                settingsStore.showWordByWord = false;
                settingsStore.showSurahView = false;
              }

              // Add/replace URL query param tafsir=true while preserving other params
              try {
                const url = new URL(window.location.href);
                url.searchParams.set('tafsir', 'true');
                url.searchParams.delete('wordbyword');
                url.searchParams.delete('surahview');
                url.searchParams.delete('surah');
                url.searchParams.delete('juz');
                // Use replaceState so navigation history isn't cluttered by repeated clicks
                history.replaceState(null, '', url.toString());
                
                // Persist URL state to IndexedDB for session restoration
                murajahDB.saveUrlState({
                  page: appStore.currentPage,
                  tafsir: true,
                  wordbyword: false
                }).catch(err => console.warn('[Murajah] Failed to save URL state:', err));
              } catch (e) {
                // ignore URL update errors
              }

              // Scroll to top (same behavior as quran navigation)
              window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }

            // Special handling for word-by-word - enable it and add URL param, then scroll to top
            if (sectionId === 'wordbyword-section') {
              // Clear explicit Quran override so Word-by-Word stays active across navigation
              forceQuranMode.value = false;
              try {
                settingsStore.showWordByWord = true;
                settingsStore.showTafsir = false; // Disable tafsir when word-by-word is enabled
                settingsStore.showSurahView = false;
                await murajahDB.setSetting('showWordByWord', true);
                await murajahDB.setSetting('showSurahView', false);
              } catch (e) {
                settingsStore.showWordByWord = true;
                settingsStore.showTafsir = false;
                settingsStore.showSurahView = false;
              }

              // Add/replace URL query param wordbyword=true while preserving other params
              try {
                const url = new URL(window.location.href);
                url.searchParams.set('wordbyword', 'true');
                url.searchParams.delete('tafsir');
                url.searchParams.delete('surahview');
                url.searchParams.delete('surah');
                url.searchParams.delete('juz');
                // Use replaceState so navigation history isn't cluttered by repeated clicks
                history.replaceState(null, '', url.toString());
                
                // Persist URL state to IndexedDB for session restoration
                murajahDB.saveUrlState({
                  page: appStore.currentPage,
                  tafsir: false,
                  wordbyword: true
                }).catch(err => console.warn('[Murajah] Failed to save URL state:', err));
              } catch (e) {
                // ignore URL update errors
              }

              // Scroll to top (same behavior as quran navigation)
              window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }

            // Special handling for surah view - show surah-by-surah browsing mode
            if (sectionId === 'surah-section') {
              // Clear explicit Quran override
              forceQuranMode.value = false;
              try {
                settingsStore.showSurahView = true;
                settingsStore.showTafsir = false;
                settingsStore.showWordByWord = false;
                await murajahDB.setSetting('showSurahView', true);
              } catch (e) {
                settingsStore.showSurahView = true;
                settingsStore.showTafsir = false;
                settingsStore.showWordByWord = false;
              }

              // Update URL - remove other view params
              try {
                const url = new URL(window.location.href);
                url.searchParams.set('surahview', 'true');
                url.searchParams.delete('tafsir');
                url.searchParams.delete('wordbyword');
                url.searchParams.delete('page');
                history.replaceState(null, '', url.toString());
              } catch (e) {
                // ignore URL update errors
              }

              // Scroll to top
              window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }

            const element = document.getElementById(sectionId);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          };

          // Recording countdown state
          const recordingCountdown = ref(null); // null, 3, 2, 1, 0 = recording started
          let countdownTimer = null;

          // Touch device detection
          const isTouchDevice = () => {
            return (
              ('ontouchstart' in window) ||
              (navigator.maxTouchPoints > 0) ||
              (navigator.msMaxTouchPoints > 0) ||
              window.matchMedia('(hover: none) and (pointer: coarse)').matches
            );
          };

          // Initialize app
          const initializeApp = async () => {
            try {
              isInitializing.value = true;
              isAppInitialized.value = false; // Prevent watch from triggering during init
              
              // Load theme from IndexedDB
              try {
                appStore.theme = await murajahDB.loadTheme();
              } catch (error) {
                console.warn('[Murajah] Failed to load theme from IndexedDB:', error);
                appStore.theme = 'light';
              }

              // Load stored data first to get the layout preference
              await loadStoredData();

              // Override tafsir visibility based on URL parameter `tafsir`
              // Only enable tafsir when the query param is exactly `tafsir=true`.
              // If the param is absent or has any other value, ensure tafsir is hidden.
              try {
                const tafsirParam = new URLSearchParams(window.location.search).get('tafsir');
                if (tafsirParam === 'true') {
                  settingsStore.showTafsir = true;
                } else {
                  settingsStore.showTafsir = false;
                }
              } catch (e) {
                // In case URL parsing fails for any reason, default to hiding tafsir
                settingsStore.showTafsir = false;
              }

              // Override word-by-word visibility based on URL parameter `wordbyword`
              // Only enable when the query param is exactly `wordbyword=true`.
              try {
                const wbwParam = new URLSearchParams(window.location.search).get('wordbyword');
                if (wbwParam === 'true') {
                  settingsStore.showWordByWord = true;
                  // Ensure tafsir is disabled when word-by-word is enabled
                  settingsStore.showTafsir = false;
                } else {
                  settingsStore.showWordByWord = false;
                }
              } catch (e) {
                settingsStore.showWordByWord = false;
              }

              // Override surah view visibility based on URL parameters
              // Enable surah view when `surahview=true` or `surah=N` or `juz=N` is present
              try {
                const urlParams = new URLSearchParams(window.location.search);
                const surahViewParam = urlParams.get('surahview');
                const surahParam = urlParams.get('surah');
                const juzParam = urlParams.get('juz');
                
                if (surahViewParam === 'true' || surahParam || juzParam) {
                  settingsStore.showSurahView = true;
                  settingsStore.showTafsir = false;
                  settingsStore.showWordByWord = false;
                  
                  // If a specific surah is requested, select it after data loads
                  if (surahParam) {
                    const surahNum = parseInt(surahParam, 10);
                    if (surahNum >= 1 && surahNum <= 114) {
                      // Defer surah selection until after data is loaded
                      setTimeout(() => selectSurah(surahNum), 500);
                    }
                  }
                  // If a specific juz is requested, select it after data loads
                  else if (juzParam) {
                    const juzNum = parseInt(juzParam, 10);
                    if (juzNum >= 1 && juzNum <= 30) {
                      // Switch to juzs tab and defer juz selection until after data is loaded
                      surahViewState.activeTab = 'juzs';
                      setTimeout(() => selectJuz(juzNum), 500);
                    }
                  }
                } else {
                  settingsStore.showSurahView = false;
                }
              } catch (e) {
                settingsStore.showSurahView = false;
              }
              
              // Load Quran data with layout parameter (translations come from cache with background refresh)
              // The unified loader now includes tafsir data
              quranData.value = await loadAllQuranData(settingsStore.layout, {
                murajahDB,
                onTranslationUpdate: handleTranslationUpdate,
                onResourceUpdate: ({ key, data }) => {
                  if (key === 'tafsir' && quranData.value && data) {
                    quranData.value.tafsirBn = data.tafsirBn;
                    quranData.value.tafsirEn = data.tafsirEn;
                    quranData.value.tafsirAr = data.tafsirAr;
                    Logger.log('[Murajah] Tafsir data updated from deferred load');
                  }
                }
              });
              
              Logger.log('[Murajah] Loaded Quran data for layout:', settingsStore.layout, {
                pages: quranData.value.layout?.pages?.length,
                words: Object.keys(quranData.value.words || {}).length,
                tafsirMapping: Object.keys(quranData.value.tafsirMapping || {}).length
              });
              
              // Load quran.json and Bangla translations in parallel (non-blocking for initial render)
              const loadSecondaryData = async () => {
                const [quranJsonResult, bnTranslationsResult] = await Promise.allSettled([
                  fetch('./resources/data/quran/quran.json').then(r => r.json()),
                  fetch('./resources/data/quran/bangali-word-by-word-translation.json').then(r => r.json())
                ]);
                
                if (quranJsonResult.status === 'fulfilled') {
                  quranData.value.quranWithPages = quranJsonResult.value;
                  Logger.log('[Murajah] Loaded quran.json for audio player');
                } else {
                  console.error('[Murajah] Failed to load quran.json:', quranJsonResult.reason);
                }
                
                if (bnTranslationsResult.status === 'fulfilled') {
                  quranData.value.translationsBn = bnTranslationsResult.value;
                  Logger.log('[Murajah] Loaded Bangla word-by-word translations');
                } else {
                  console.error('[Murajah] Failed to load Bangla translations:', bnTranslationsResult.reason);
                }
              };
              
              // Run secondary data loading and daily goals in parallel
              await Promise.all([
                loadSecondaryData(),
                initializeDailyGoals()
              ]);
              
              // Defer cache stats to after initial render (expensive operation)
              requestIdleCallback ? requestIdleCallback(() => updateCacheStats()) : setTimeout(() => updateCacheStats(), 2000);
              
              // Preload the other layout in background for faster switching (longer delay)
              setTimeout(() => {
                const otherLayout = settingsStore.layout === 'qpc' ? 'indopak' : 'qpc';
                preloadLayout(otherLayout, murajahDB);
              }, 10000);
              
              Logger.log('[Murajah] App initialized | Layout:', settingsStore.layout, '| Memorized pages:', memorizedStore.memorizedPages.size);

              // Check if language has been selected, if not show modal to new user
              try {
                const languageSelected = await murajahDB.hasLanguageBeenSelected();
                if (!languageSelected) {
                  showLanguageSelectionModal.value = true;
                  Logger.log('[Murajah] Showing language selection modal for new user');
                }
              } catch (error) {
                console.warn('[Murajah] Failed to check language selection flag:', error);
              }
            } catch (error) {
              console.error('[Murajah] Initialization error:', error);
            } finally {
              isInitializing.value = false;
              isAppInitialized.value = true; // Now allow watch to trigger
            }
          };

          const loadStoredData = async () => {
            try {
              // Try to load from IndexedDB first
              const data = await murajahDB.loadData();
              if (data) {
                if (data.memorized) memorizedStore.memorizedPages = new Set(data.memorized);
                if (data.perfectRevisions) {
                  perfectRevisionsStore.perfectRevisions = new Map(Object.entries(data.perfectRevisions).map(([k, v]) => [parseInt(k), v]));
                }
                if (data.mistakes) {
                  mistakesStore.mistakes = new Map(Object.entries(data.mistakes).map(([k, v]) => [parseInt(k), new Set(v)]));
                }
                if (data.recordings) {
                  // Load recordings with their blobs from IndexedDB
                  audioStore.recordings = [];
                  for (let i = 0; i < data.recordings.length; i++) {
                    try {
                      const recordingWithBlob = await murajahDB.loadRecording(i);
                      if (recordingWithBlob) {
                        // Ensure duration is a number
                        if (recordingWithBlob.duration !== undefined && recordingWithBlob.duration !== null) {
                          recordingWithBlob.duration = Number(recordingWithBlob.duration);
                        }
                        audioStore.recordings.push(recordingWithBlob);
                      }
                    } catch (error) {
                      console.warn('[Murajah] Failed to load recording blob:', error);
                    }
                  }
                  // Pre-sort descending by timestamp (newest first)
                  audioStore.recordings.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }
                if (data.settings) {
                  Object.assign(settingsStore, data.settings);
                  // Load selectedTasks for daily goals
                  if (data.settings.selectedTasks) {
                    dailyGoalsStore.selectedTasks = data.settings.selectedTasks;
                  }
                }
              } else {
                // Fallback: Try localStorage for backward compatibility
                const stored = localStorage.getItem('murajah-data');
                if (stored) {
                  const data = JSON.parse(stored);
                  if (data.memorized) memorizedStore.memorizedPages = new Set(data.memorized);
                  if (data.perfectRevisions) {
                    perfectRevisionsStore.perfectRevisions = new Map(Object.entries(data.perfectRevisions).map(([k, v]) => [parseInt(k), v]));
                  }
                  if (data.mistakes) {
                    mistakesStore.mistakes = new Map(Object.entries(data.mistakes).map(([k, v]) => [parseInt(k), new Set(v)]));
                  }
                  if (data.recordings) audioStore.recordings = data.recordings;
                  if (data.settings) {
                    Object.assign(settingsStore, data.settings);
                    // Load selectedTasks for daily goals
                    if (data.settings.selectedTasks) {
                      dailyGoalsStore.selectedTasks = data.settings.selectedTasks;
                    }
                  }
                  
                  // Migrate to IndexedDB
                  await saveData();
                  localStorage.removeItem('murajah-data');
                }
              }
            } catch (error) {
              console.error('[Murajah] Failed to load stored data:', error);
            }

            // Load notes from dedicated notes store
            try {
              await loadNotes(murajahDB, notesStore);
            } catch (error) {
              console.warn('[Murajah] Failed to load notes:', error);
            }

            // Ensure fontSize is always a valid value
            if (!['small', 'medium', 'large'].includes(settingsStore.fontSize)) {
              settingsStore.fontSize = 'medium';
            }
            // Ensure layout is always a valid value
            if (!['qpc', 'indopak'].includes(settingsStore.layout)) {
              settingsStore.layout = 'qpc';
            }
            // Ensure audioPlayMode is always a valid value
            if (!['verse', 'page'].includes(settingsStore.audioPlayMode)) {
              settingsStore.audioPlayMode = 'verse';
            }
            // Force verse mode if layout is indopak (page-by-page only works with QPC)
            if (settingsStore.layout === 'indopak' && settingsStore.audioPlayMode === 'page') {
              settingsStore.audioPlayMode = 'verse';
            }
          };

          // Save data to IndexedDB
          const saveData = async () => {
            // Separate recordings data: blobs go to IndexedDB recordings store, metadata to appData
            const recordingsMetadata = audioStore.recordings.map(r => ({
              pageNumber: r.pageNumber,
              recordedAt: r.recordedAt,
              duration: Number(r.duration) || 0, // Ensure duration is a number
              timestamp: r.timestamp
            }));

            // Extract plain objects from reactive stores (Proxy objects can't be cloned by IndexedDB)
            const plainSettings = {
              finishRevisionDays: Number(settingsStore.finishRevisionDays),
              pagesPerDay: Number(settingsStore.pagesPerDay),
              fontSize: String(settingsStore.fontSize),
              tajweedEnabled: Boolean(settingsStore.tajweedEnabled),
              showTafsir: Boolean(settingsStore.showTafsir),
              showMorphology: Boolean(settingsStore.showMorphology),
              layout: String(settingsStore.layout),
              selectedTasks: Array.isArray(dailyGoalsStore.selectedTasks) 
                ? dailyGoalsStore.selectedTasks.map(t => String(t))
                : [],
              quranBackgroundColor: String(settingsStore.quranBackgroundColor),
              audioPlayMode: String(settingsStore.audioPlayMode)
            };

            const data = {
              memorized: Array.from(memorizedStore.memorizedPages).map(p => Number(p)),
              perfectRevisions: Object.fromEntries(
                Array.from(perfectRevisionsStore.perfectRevisions).map(([k, v]) => [String(k), Number(v)])
              ),
              mistakes: Object.fromEntries(
                Array.from(mistakesStore.mistakes).map(([key, val]) => [String(key), Array.from(val).map(v => Number(v))])
              ),
              recordings: recordingsMetadata, // Only metadata, not blobs
              settings: plainSettings, // Plain object, not Proxy
              lastSaved: new Date().toISOString()
            };
            try {

              settingsStore.tajweedEnabled = false;

            // Clear cached data and reload with new layout
            clearDataCache();
            appStore.loading = true;
            
            try {
              // Preserve existing data that doesn't change with layout
              const preservedData = {
                quranWithPages: quranData.value?.quranWithPages,
                translationsBn: quranData.value?.translationsBn

              // Restore preserved data

              }
              if (preservedData.translationsBn) {
                quranData.value.translationsBn = preservedData.translationsBn;
              }
              
              // Adjust current page if it exceeds new layout's total pages
              if (appStore.currentPage > totalPages.value) {
                await goToPageNumber(totalPages.value);
              }
              
              // Reload font for new layout
              loadPageFont(appStore.currentPage);
              
              appStore.successMessage = t('settings.fontSwitched', { font: t(`layout.${nextMode}`) });

              updateSettings();

              console.error('[Murajah] Failed to switch font:', error);
              appStore.errorMessage = 'Failed to switch font. Please try again.';
              setTimeout(() => appStore.errorMessage = '', 3000);
            } finally {
              appStore.loading = false;

          // Theme functions - Always use light mode
          const applyThemeToDOM = (theme) => {

            document.documentElement.classList.remove('dark-mode');
            document.body.classList.remove('dark-mode');

            document.documentElement.style.color = '#111827';

          };

          // Perfect Revision functions
          const getPerfectCount = (pageNum) => {

          const getHifzScore = (pageNum) => {
            const perfectCount = getPerfectCount(pageNum);
            // Cap at 100, but allow negative scores to go to 0
            return Math.max(0, Math.min(perfectCount, 100));

          // Get score colors for UI display
          const getScoreColors = (score) => {
            if (score > 90) {
              return { label: 'Firm', bg: '#111', color: '#fff', icon: 'la-star' };

              return { label: 'Strong', bg: '#1b5e20', color: '#fff', icon: 'la-check-circle' };

          // ========== SURAH VIEW FUNCTIONS ==========

          const getVerseQPCText = (surahNum, ayahNum) => {
            if (!quranData.value || !quranData.value.words) {
              return null;
            }
            
            const words = [];
            // Word keys are in format "surah:ayah:word" e.g., "2:158:7"
            // Iterate through word numbers until no more found
            let wordNum = 1;
            while (true) {
              const key = `${surahNum}:${ayahNum}:${wordNum}`;
              const word = quranData.value.words[key];
              if (!word) break;

              // Include the page where next surah starts (current surah may end there)

          // Load font for a specific page in Surah View

          // Select a surah and load its pages lazily

                // Ignore URL update errors
              }
              
              Logger.log(`[Murajah] Loaded surah ${surahNum} with ${surahVerses.length} verses across ${pageNumbers.length} pages (${startPage}-${endPage})`);
            } catch (error) {
              console.error('[Murajah] Failed to load surah:', error);
              appStore.errorMessage = 'Failed to load surah. Please try again.';
              setTimeout(() => appStore.errorMessage = '', 5000);
            } finally {
              surahViewState.isLoading = false;
              // Load first page immediately
              loadMoreSurahPages();
              // Start background loading of remaining pages
              scheduleBackgroundPageLoad();
            }
          };
          
          // Load more pages for lazy loading - renders pages like the main Quran view
          const loadMoreSurahPages = () => {
            if (!surahViewState.hasMore || surahViewState.isLoading || !quranData.value) {
              return;
            }
            
            const currentCount = surahViewState.loadedPageCount;
            const totalPages = surahViewState.allPages.length;
            const nextPageNumbers = surahViewState.allPages.slice(currentCount, currentCount + surahViewState.pageBatchSize);
            const selectedSurah = surahViewState.selectedSurah;
            
            if (nextPageNumbers.length > 0 && quranData.value.layout && quranData.value.words) {
              nextPageNumbers.forEach((pageNum, pageIdx) => {
                // Load font for this page
                loadSurahViewPageFont(pageNum);
                
                // Get page lines using the same function as main Quran view
                let pageLines = getPageWordsDetailed(pageNum, quranData.value.layout, quranData.value.words);
                
                if (pageLines && pageLines.length > 0) {
                  // Filter lines to only show content from the selected surah
                  // Skip surah_name lines as they are decorative - we show surah info in the header
                  const filteredLines = pageLines.map(line => {
                    // Skip surah_name decoration lines - header already shows surah info
                    if (line.type === 'surah_name') {
                      return null;
                    }
                    
                    // For ayah lines, filter words to only include those from the selected surah
                    if (line.type === 'ayah' && line.words && line.words.length > 0) {
                      // Compare as strings since word.surah may be string or number
                      const selectedSurahStr = String(selectedSurah);
                      const filteredWords = line.words.filter(word => String(word.surah) === selectedSurahStr);
                      
                      // If no words from this surah, skip the line
                      if (filteredWords.length === 0) {
                        return null;
                      }
                      
                      return {
                        ...line,
                        words: filteredWords
                      };
                    }
                    
                    return line;
                  }).filter(line => line !== null);
                  
                  // Only add the page if it has content for this surah
                  if (filteredLines.length > 0) {

                      lines: filteredLines

            if (backgroundLoadTimer) {

              backgroundLoadTimer = null;

            if (!surahViewState.hasMore || !surahViewState.selectedSurah) {

                scheduleBackgroundPageLoad();

          // Touch-safe word click handler for WebView
          // Tracks touch state to distinguish taps from scrolls/long-press
          let wordTouchStartX = 0;
          let wordTouchStartY = 0;
          let wordTouchStartTime = 0;
          let wordTouchHandled = false;

          const handleWordTouchStart = (word, event) => {
            if (event.touches && event.touches.length > 0) {
              const touch = event.touches[0];
              wordTouchStartX = touch.clientX;
              wordTouchStartY = touch.clientY;
              wordTouchStartTime = Date.now();
              wordTouchHandled = false;
            }
          };

          const handleWordTouchEnd = (word, event) => {
            if (wordTouchStartTime === 0) return;

            const duration = Date.now() - wordTouchStartTime;
            if (duration > 400) {
              wordTouchStartTime = 0;
              return; // Long press — ignore
            }

            let distance = 0;
            if (event.changedTouches && event.changedTouches.length > 0) {
              const touch = event.changedTouches[0];
              const dx = touch.clientX - wordTouchStartX;
              const dy = touch.clientY - wordTouchStartY;
              distance = Math.sqrt(dx * dx + dy * dy);
            }

            if (distance > 15) {
              wordTouchStartTime = 0;
              return; // Scroll/swipe — ignore
            }

            // Valid tap
            wordTouchHandled = true;
            wordTouchStartTime = 0;
            handleWordClick(word, event);

            if (!dailyGoalsStore.todayGoal || !dailyGoalsStore.todayGoal.tasks.reviewRange) {
              console.warn('[Murajah] Cannot apply revision chunk adjustment - no today goal or reviewRange task');
              return;

            const adjustment = Number(settingsStore.adjustRevisionChunk) || 0;
            const totalChunks = dailyGoalsStore.todayGoal.totalChunks || 1;
            
            // Ensure adjustment is within valid range
            const newRotationIndex = Math.min(adjustment, totalChunks - 1);
            
            Logger.log('[Murajah] Applying revision chunk adjustment:', {
              adjustment: adjustment,
              totalChunks: totalChunks,
              currentRotationIndex: dailyGoalsStore.todayGoal.rotationIndex,
              newRotationIndex: newRotationIndex
            });

            // Recalculate the review range with fair distribution
            const memorizedArray = Array.from(memorizedStore.memorizedPages || []).sort((a, b) => a - b);
            if (memorizedArray.length === 0) {
              console.warn('[Murajah] No memorized pages to adjust rotation');
              return;
            }

            const totalPages = memorizedArray.length;
            const baseChunkSize = Math.floor(totalPages / totalChunks);
            const remainder = totalPages % totalChunks;
            
            // Helper function to get chunk size for a given chunk index
            const getChunkSize = (chunkIdx) => {
              return chunkIdx < remainder ? baseChunkSize + 1 : baseChunkSize;
            };

            // Calculate start index by summing sizes of all previous chunks
            let startIdx = 0;
            for (let i = 0; i < newRotationIndex; i++) {
              startIdx += getChunkSize(i);
            }
            
            const currentChunkSize = getChunkSize(newRotationIndex);
            const endIdx = Math.min(startIdx + currentChunkSize, totalPages);
            const pagesForReview = memorizedArray.slice(startIdx, endIdx);

            // Update the goal with new rotation info
            dailyGoalsStore.todayGoal.rotationIndex = newRotationIndex;
            dailyGoalsStore.todayGoal.chunkNumber = newRotationIndex + 1;
            dailyGoalsStore.todayGoal.tasks.reviewRange.pages = pagesForReview;

          const importData = () => {

                  mistakesStore.mistakes = new Map(
                    Object.entries(data.mistakes).map(([k, v]) => [

                    dailyGoalsStore.streak = data.dailyGoals.streak;

                  if (typeof data.dailyGoals.longestStreak === 'number') {

                  if (Array.isArray(data.dailyGoals.selectedTasks)) {
                    dailyGoalsStore.selectedTasks = data.dailyGoals.selectedTasks;
                  }
                  Logger.log(`[Murajah] Imported daily goals - streak: ${dailyGoalsStore.streak}, history: ${dailyGoalsStore.goalHistory.length} days, longest streak: ${dailyGoalsStore.longestStreak}`);
                  
                  // Save daily goals to IndexedDB
                  Logger.log('[Murajah] Saving imported daily goals to database...');
                  let savedGoalsCount = 0;
                  
                  // Save todayGoal if present
                  if (data.dailyGoals.todayGoal) {
                    try {
                      await murajahDB.saveDailyGoal(data.dailyGoals.todayGoal);

                      Logger.log(`[Murajah] Saved todayGoal for ${data.dailyGoals.todayGoal.date}`);
                    } catch (error) {
                      console.error('[Murajah] Failed to save todayGoal:', error);
                    }
                  }
                  
                  // Save goal history
                  if (Array.isArray(data.dailyGoals.goalHistory)) {
                    for (const goal of data.dailyGoals.goalHistory) {
                      try {
                        await murajahDB.saveDailyGoal(goal);
                        savedGoalsCount++;
                      } catch (error) {
                        console.error(`[Murajah] Failed to save goal for ${goal.date}:`, error);

                    Logger.log(`[Murajah] Saved ${savedGoalsCount} daily goals to database`);

                } else {
                  console.warn('[Murajah] No daily goals found in backup');
                }

                // Save imported data to IndexedDB
                await saveData();
                Logger.log('[Murajah] Data saved to IndexedDB');

                // Import notes if present in backup
                if (data.notes && Array.isArray(data.notes)) {
                  for (const note of data.notes) {
                    try {
                      await murajahDB.saveNote(note);

                      console.warn('[Murajah] Failed to import note:', note.id, e);

          const resetApp = async () => {
            if (confirm('Are you sure? This will reset all data.')) {
              try {

                mistakesStore.mistakes.clear();
                audioStore.recordings = [];
                await goToPageNumber(1);
                await murajahDB.clearAll();
